    /* --------------------------------------------------------------------------
       VIEW 4: CONTINUOUS WALK MODE (STREAMLINED WARD-TO-WARD FIELD MODE)
       -------------------------------------------------------------------------- */
    function renderWalkMode() {
      const sorted = getSortedWardsList();
      if (sorted.length === 0) {
        return `
          <div class="sf-module p-6 text-center">
            <p class="mb-4">Keine Stationen registriert.</p>
            <button type="button" id="wm-add-ward" class="touch-btn px-5 py-3 bg-zkimed-red text-white font-bold">Station anlegen</button>
          </div>
        `;
      }

      let currentIdx = sorted.findIndex(w => w.id === state.ui.walkWardId);
      if (currentIdx === -1) {
        currentIdx = 0;
        state.ui.walkWardId = sorted[0].id;
      }
      const ward = sorted[currentIdx];
      const nextWard = sorted[(currentIdx + 1) % sorted.length];
      const today = getTodayISO();
      const visitedTodayCount = sorted.filter(w => state.visits.some(v => v.wardId === w.id && v.date === today)).length;
      const wardStats = getWardStats(ward.id);

      const { walkDate, walkStatus, walkCount, walkNote } = state.ui;

      return `
        <div class="space-y-4">
          <!-- WALK MODE BANNER & STATION PROGRESS STRIP -->
          <section class="sf-module border-zkimed-red">
            <div class="bg-zkimed-red text-white px-4 py-2.5 flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2.5">
                <span class="w-2.5 h-2.5 bg-white telemetry-dot"></span>
                <span class="font-display font-bold uppercase tracking-widest text-sm">CONTINUOUS WALK MODE · AKTIVER RUNDGANG</span>
              </div>
              <div class="flex items-center gap-3">
                <span class="font-mono text-xs sm:text-sm font-bold">HEUTE ABGESCHLOSSEN: ${visitedTodayCount} / ${sorted.length}</span>
                <button type="button" id="wm-exit-btn" class="px-3 py-1 bg-white/15 hover:bg-white/25 border border-white/40 text-xs font-display font-bold uppercase tracking-wider">
                  Beenden
                </button>
              </div>
            </div>

            <!-- Horizontal Touchable Station Strip -->
            <div class="p-3 bg-space-panel border-b border-space-borderLight flex items-center gap-2 overflow-x-auto no-scrollbar">
              ${sorted.map((w, i) => {
                const isCurrent = w.id === ward.id;
                const doneToday = state.visits.some(v => v.wardId === w.id && v.date === today);
                return `
                  <button type="button" data-wm-select="${w.id}" class="wm-pill-btn touch-btn min-h-[44px] px-3.5 py-2 border shrink-0 font-mono text-xs font-bold flex items-center gap-1.5 ${
                    isCurrent
                      ? 'bg-space-graphite text-white border-space-graphite sf-reticle'
                      : doneToday
                        ? 'bg-zkimed-greenLight text-zkimed-green border-zkimed-green'
                        : 'bg-white text-space-graphite border-space-border hover:bg-space-metal'
                  }">
                    <span>${i + 1}. ${escapeHTML(w.stationNumber)}</span>
                    ${doneToday ? `<span>✓</span>` : ''}
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Current Station Field Briefing -->
            <div class="p-4 sm:p-5 grid grid-cols-1 lg:grid-cols-12 gap-5">
              <!-- Left Column: Station Essentials & Mailbox -->
              <div class="lg:col-span-5 space-y-3.5 border-b lg:border-b-0 lg:border-r border-space-borderLight pb-4 lg:pb-0 lg:pr-5">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <span class="font-mono text-xs font-bold text-space-teal">STATION ${currentIdx + 1} VON ${sorted.length}</span>
                    <h2 class="font-display text-2xl sm:text-3xl font-bold text-space-graphite mt-0.5">${escapeHTML(ward.stationNumber)}</h2>
                    ${ward.wardName ? `<div class="text-base font-semibold text-space-slate">${escapeHTML(ward.wardName)}</div>` : ''}
                  </div>
                  ${wardStats.visitedToday ? `
                    <span class="px-2.5 py-1 bg-zkimed-green text-white font-mono text-xs font-bold">✓ HEUTE ERFASST</span>
                  ` : ''}
                </div>

                <div class="p-3.5 bg-zkimed-redLight border-l-4 border-l-zkimed-red">
                  <div class="font-display text-xs font-bold uppercase tracking-wider text-zkimed-red flex items-center gap-1.5">
                    ${ICONS.mailbox}
                    <span>Postfach-Ort</span>
                  </div>
                  <div class="text-base font-bold text-space-graphite mt-1">${escapeHTML(ward.mailboxLocation)}</div>
                </div>

                <div class="space-y-2 text-sm">
                  <div>
                    <span class="font-display text-xs font-bold uppercase text-space-teal block">Standort</span>
                    <span class="text-space-graphite font-medium">${escapeHTML(ward.location)}</span>
                  </div>
                  <div>
                    <span class="font-display text-xs font-bold uppercase text-space-teal block">Ansprechpartner</span>
                    <span class="text-space-graphite font-medium">
                      ${escapeHTML(ward.contactName || '—')}
                      ${ward.contactInfo ? `<span class="font-mono text-xs text-space-slate"> (${escapeHTML(ward.contactInfo)})</span>` : ''}
                    </span>
                  </div>
                  ${ward.notes ? `
                    <div class="p-3 bg-space-panel border border-space-borderLight">
                      <span class="font-display text-[11px] font-bold uppercase text-space-teal block mb-1">Stationshinweis</span>
                      <p class="text-xs sm:text-sm text-space-graphite leading-relaxed">${escapeHTML(ward.notes)}</p>
                    </div>
                  ` : ''}
                </div>

                <div class="pt-1">
                  <button type="button" id="wm-open-detail-btn" class="text-xs font-display font-bold uppercase tracking-wider text-space-teal hover:text-zkimed-red underline">
                    Vollständiges Stationsprofil öffnen →
                  </button>
                </div>
              </div>

              <!-- Right Column: Fast Consent Entry -->
              <div class="lg:col-span-7 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <span class="font-display text-xs font-bold uppercase tracking-wider text-space-teal">Rundgang dokumentieren</span>
                  <div class="flex items-center gap-2">
                    <label for="wm-date-input" class="text-xs font-semibold text-space-slate">Datum:</label>
                    <input type="date" id="wm-date-input" value="${escapeHTML(walkDate)}" class="touch-input min-h-[42px] py-1.5 px-3 font-mono text-sm font-semibold" />
                  </div>
                </div>

                <!-- Status Buttons -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                  ${Object.values(VISIT_STATUS).map(st => {
                    const active = walkStatus === st.key;
                    let cls = 'border-space-border bg-white text-space-graphite hover:bg-space-panel';
                    if (active) {
                      if (st.key === 'BROAD_CONSENT') cls = 'border-zkimed-green bg-zkimed-green text-white';
                      else if (st.key === 'UNINFORMIERT') cls = 'border-zkimed-amber bg-zkimed-amber text-white';
                      else cls = 'border-zkimed-bluegrey bg-zkimed-bluegrey text-white';
                    }
                    return `
                      <button type="button" data-wm-status="${st.key}" class="wm-status-btn touch-btn min-h-[58px] px-3.5 py-2.5 border-2 font-bold text-sm sm:text-base text-center ${cls}">
                        ${escapeHTML(st.label)}
                      </button>
                    `;
                  }).join('')}
                </div>

                <!-- Dynamic Counter -->
                ${walkStatus === 'BROAD_CONSENT' ? `
                  <div class="p-4 bg-zkimed-greenLight border-2 border-zkimed-green">
                    <div class="flex items-center justify-between mb-2">
                      <span class="font-display text-xs font-bold uppercase tracking-wider text-zkimed-green">Anzahl Broad Consents</span>
                      <div class="flex gap-1.5">
                        <button type="button" data-wm-add="1" class="wm-quick-add touch-btn min-h-[38px] px-2.5 py-1 bg-white border border-zkimed-green text-zkimed-green font-mono text-xs font-bold">+1</button>
                        <button type="button" data-wm-add="2" class="wm-quick-add touch-btn min-h-[38px] px-2.5 py-1 bg-white border border-zkimed-green text-zkimed-green font-mono text-xs font-bold">+2</button>
                        <button type="button" data-wm-add="5" class="wm-quick-add touch-btn min-h-[38px] px-2.5 py-1 bg-white border border-zkimed-green text-zkimed-green font-mono text-xs font-bold">+5</button>
                      </div>
                    </div>
                    <div class="flex items-center gap-3">
                      <button type="button" id="wm-dec-btn" class="touch-btn w-16 h-16 bg-white border-2 border-zkimed-green text-zkimed-green font-mono text-3xl font-bold flex items-center justify-center">−</button>
                      <input type="number" id="wm-count-input" min="0" inputmode="numeric" value="${walkCount}" class="touch-input flex-1 h-16 text-center font-mono text-3xl font-bold border-2 border-zkimed-green" />
                      <button type="button" id="wm-inc-btn" class="touch-btn w-16 h-16 bg-zkimed-green text-white font-mono text-3xl font-bold flex items-center justify-center">+</button>
                    </div>
                  </div>
                ` : ''}

                <!-- Quick Note -->
                <div>
                  <input type="text" id="wm-note-input" value="${escapeHTML(walkNote)}" placeholder="Optionale Rundgangsnotiz..." class="touch-input w-full mb-2" />
                  <div class="flex flex-wrap gap-1.5">
                    ${state.settings.quickNotes.map(tpl => `
                      <button type="button" data-wm-chip="${escapeHTML(tpl)}" class="wm-note-chip touch-btn min-h-[38px] px-2.5 py-1 bg-space-panel hover:bg-space-metal border border-space-borderLight text-xs text-space-graphite text-left">
                        + ${escapeHTML(tpl)}
                      </button>
                    `).join('')}
                  </div>
                </div>

                <!-- Walk Mode Primary Actions -->
                <div class="pt-2 flex flex-col sm:flex-row gap-3">
                  <button type="button" id="wm-save-next-btn" class="touch-btn min-h-[58px] flex-1 px-5 py-3 bg-zkimed-red hover:bg-zkimed-redDark text-white font-display font-bold uppercase tracking-wider text-sm flex items-center justify-center gap-2 shadow-sm">
                    <span>SPEICHERN &amp; NÄCHSTE STATION (${escapeHTML(nextWard.stationNumber)}) →</span>
                  </button>
                  <button type="button" id="wm-skip-btn" class="touch-btn min-h-[58px] px-5 py-3 bg-white hover:bg-space-panel border border-space-border text-space-graphite font-display font-bold uppercase tracking-wider text-xs sm:text-sm">
                    Überspringen →
                  </button>
                </div>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    /* --------------------------------------------------------------------------
       VIEW 5: RUNDGÄNGE (GLOBAL VISIT LOG GROUPED BY DATE)
       -------------------------------------------------------------------------- */
    function renderRundgaengeView() {
      const wardMap = Object.fromEntries(state.wards.map(w => [w.id, w]));
      const q = state.ui.logSearch.trim().toLowerCase();

      let filtered = [...state.visits];
      if (state.ui.logDateFilter) {
        filtered = filtered.filter(v => v.date === state.ui.logDateFilter);
      }
      if (state.ui.logStationFilter !== 'ALL') {
        filtered = filtered.filter(v => v.wardId === state.ui.logStationFilter);
      }
      if (state.ui.logStatusFilter !== 'ALL') {
        filtered = filtered.filter(v => v.status === state.ui.logStatusFilter);
      }
      if (q) {
        filtered = filtered.filter(v => {
          const w = wardMap[v.wardId];
          return (
            (v.note && v.note.toLowerCase().includes(q)) ||
            (w && w.stationNumber.toLowerCase().includes(q)) ||
            (w && w.wardName && w.wardName.toLowerCase().includes(q))
          );
        });
      }

      filtered.sort((a, b) => {
        if (b.date !== a.date) return b.date.localeCompare(a.date);
        return (b.createdAt || 0) - (a.createdAt || 0);
      });

      // Group by date
      const groupsMap = new Map();
      filtered.forEach(v => {
        if (!groupsMap.has(v.date)) groupsMap.set(v.date, []);
        groupsMap.get(v.date).push(v);
      });

      const sortedWards = getSortedWardsList();

      return `
        <div class="space-y-4">
          <section class="sf-module">
            <div class="sf-module-header justify-between">
              <span class="sf-label">GESAMTPROTOKOLL RUNDGÄNGE · SURVEY LOG (${filtered.length})</span>
              ${(state.ui.logDateFilter || state.ui.logStationFilter !== 'ALL' || state.ui.logStatusFilter !== 'ALL' || q) ? `
                <button type="button" id="log-reset-filters" class="text-xs font-display font-bold uppercase text-zkimed-red hover:underline">
                  Filter zurücksetzen
                </button>
              ` : ''}
            </div>

            <div class="p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
              <div>
                <label class="block text-[11px] font-display font-bold uppercase text-space-teal mb-1">Datum filtern</label>
                <input type="date" id="log-date-input" value="${escapeHTML(state.ui.logDateFilter)}" class="touch-input w-full font-mono text-sm" />
              </div>

              <div>
                <label class="block text-[11px] font-display font-bold uppercase text-space-teal mb-1">Station filtern</label>
                <select id="log-station-select" class="touch-input w-full text-sm">
                  <option value="ALL">Alle Stationen</option>
                  ${sortedWards.map(w => `
                    <option value="${w.id}" ${state.ui.logStationFilter === w.id ? 'selected' : ''}>${escapeHTML(w.stationNumber)} ${w.wardName ? `(${escapeHTML(w.wardName)})` : ''}</option>
                  `).join('')}
                </select>
              </div>

              <div>
                <label class="block text-[11px] font-display font-bold uppercase text-space-teal mb-1">Status filtern</label>
                <select id="log-status-select" class="touch-input w-full text-sm">
                  <option value="ALL">Alle Status</option>
                  ${Object.values(VISIT_STATUS).map(st => `
                    <option value="${st.key}" ${state.ui.logStatusFilter === st.key ? 'selected' : ''}>${escapeHTML(st.label)}</option>
                  `).join('')}
                </select>
              </div>

              <div>
                <label class="block text-[11px] font-display font-bold uppercase text-space-teal mb-1">Suche in Notizen / Station</label>
                <input type="search" id="log-search-input" value="${escapeHTML(state.ui.logSearch)}" placeholder="Suchbegriff..." class="touch-input w-full text-sm" />
              </div>
            </div>
          </section>

          ${groupsMap.size === 0 ? `
            <div class="sf-module p-6">
              <div class="sf-stripes p-8 text-center">
                <div class="font-mono text-sm font-bold uppercase text-space-slate">KEINE RUNDGANG-EINTRÄGE GEFUNDEN</div>
                <p class="text-sm text-space-slate mt-1">Für die gewählten Filter liegen keine Einträge vor.</p>
              </div>
            </div>
          ` : Array.from(groupsMap.entries()).map(([dateISO, items]) => {
            const dayConsents = items.reduce((s, v) => s + (v.status === 'BROAD_CONSENT' ? (Number(v.consentCount) || 0) : 0), 0);
            return `
              <section class="sf-module">
                <div class="sf-module-header justify-between">
                  <div class="flex items-center gap-2.5">
                    <span class="font-mono text-sm font-bold text-space-graphite">${formatDateDE(dateISO)}</span>
                    ${dateISO === getTodayISO() ? `<span class="px-2 py-0.5 bg-zkimed-red text-white font-mono text-[10px] font-bold">HEUTE</span>` : ''}
                  </div>
                  <div class="flex items-center gap-3 font-mono text-xs">
                    <span class="text-space-slate">${items.length} Rundgänge</span>
                    <span class="font-bold text-zkimed-green">+${dayConsents} Consents</span>
                  </div>
                </div>

                <div class="divide-y divide-space-borderLight">
                  ${items.map(v => {
                    const w = wardMap[v.wardId];
                    return `
                      <div class="p-3.5 sm:px-5 flex flex-col md:flex-row md:items-center justify-between gap-3 hover:bg-space-panel/60">
                        <div class="space-y-1 flex-1 min-w-0">
                          <div class="flex flex-wrap items-center gap-2.5">
                            <button type="button" data-open-ward="${v.wardId}" class="log-ward-link font-display text-base font-bold text-space-graphite hover:text-zkimed-red underline">
                              ${escapeHTML(w ? w.stationNumber : 'Unbekannte Station')}
                            </button>
                            ${w && w.wardName ? `<span class="text-xs text-space-slate">${escapeHTML(w.wardName)}</span>` : ''}
                            ${renderStatusBadge(v.status, true)}
                            ${v.status === 'BROAD_CONSENT' ? `
                              <span class="font-mono text-xs font-bold px-2 py-0.5 bg-zkimed-green text-white">
                                ${v.consentCount} Consent${v.consentCount === 1 ? '' : 's'}
                              </span>
                            ` : ''}
                          </div>
                          ${v.note ? `<p class="text-xs sm:text-sm text-space-slate">${escapeHTML(v.note)}</p>` : ''}
                        </div>

                        <div class="flex items-center gap-2 shrink-0">
                          <button type="button" data-edit-visit="${v.id}" class="edit-visit-btn touch-btn px-3 py-2 border border-space-border bg-white hover:bg-space-panel text-xs font-semibold flex items-center gap-1">
                            ${ICONS.edit}
                            <span>Bearbeiten</span>
                          </button>
                          <button type="button" data-delete-visit="${v.id}" class="delete-visit-btn touch-btn px-3 py-2 border border-zkimed-red/40 bg-zkimed-redLight hover:bg-zkimed-red hover:text-white text-zkimed-red text-xs font-semibold flex items-center gap-1">
                            ${ICONS.trash}
                            <span>Löschen</span>
                          </button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </section>
            `;
          }).join('')}
        </div>
      `;
    }

    /* --------------------------------------------------------------------------
       VIEW 6: DATA / EXPORT (.XLSX & JSON BACKUP)

                    </div>
                    <div class="p-3 bg-space-panel border border-space-borderLight">
                      <div class="font-display font-bold uppercase text-space-graphite">Blatt 2: Rundgänge (${stats.totalVisits} Zeilen)</div>
                      <div class="text-space-slate mt-0.5">Chronologische Einzelauflistung aller dokumentierten Rundgänge mit Datum, Status, Anzahl Broad Consents und Rundgangsnotiz.</div>

                        ${uniqueDates.slice(0, 8).map(d => {
                          const count = state.visits.filter(v => v.date === d).length;
                          const isSel = d === selectedDate;
                          return `
                            <button type="button" data-exp-quick-date="${d}" class="exp-quick-date touch-btn min-h-[38px] px-3 py-1 border font-mono text-xs font-bold ${isSel ? 'bg-space-graphite text-white border-space-graphite' : 'bg-white text-space-graphite border-space-border hover:bg-space-panel'}">
                              ${formatDateDE(d)} (${count})

                      </div>

                  <div class="p-3 bg-space-panel border border-space-borderLight flex items-center justify-between text-xs sm:text-sm">
                    <span class="font-semibold text-space-graphite">Vorschau für ${formatDateDE(selectedDate)}:</span>
                    <span class="font-mono font-bold text-zkimed-red">${dayVisits.length} Rundgänge</span>
                  </div>
                </div>
              </div>

              <div class="p-5 pt-0">
                <button type="button" id="exp-day-btn" ${dayVisits.length === 0 ? 'disabled' : ''} class="touch-btn min-h-[56px] w-full px-5 py-3 font-display font-bold uppercase tracking-wider text-sm flex items-center justify-center gap-2 ${dayVisits.length > 0 ? 'bg-zkimed-red hover:bg-zkimed-redDark text-white shadow-sm' : 'bg-space-metal text-space-slate border border-space-border cursor-not-allowed'}">

                  <span>Tagesrundgang exportieren (.xlsx)</span>
                </button>
              </div>

          <!-- LIVE PREVIEW TABLE FOR SELECTED DAY -->
          <section class="sf-module">
            <div class="sf-module-header justify-between">
              <span class="sf-label">DATENVORSCHAU · TAGESRUNDGANG (${formatDateDE(selectedDate)})</span>
              <span class="font-mono text-xs text-space-slate">${dayVisits.length} Einträge</span>
            </div>
            ${dayVisits.length === 0 ? `
              <div class="p-6">
                <div class="sf-stripes p-6 text-center font-mono text-xs uppercase text-space-slate">
                  KEINE RUNDGÄNGE AM ${formatDateDE(selectedDate)} DOKUMENTIERT
                </div>

            ` : `
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                  <thead>
                    <tr class="bg-space-panel border-b border-space-border font-display text-xs uppercase tracking-wider text-space-teal">
                      <th class="p-3">Station</th>
                      <th class="p-3">Standort</th>
                      <th class="p-3">Status</th>
                      <th class="p-3">Consents</th>
                      <th class="p-3">Notiz</th>
                      <th class="p-3">Ansprechpartner</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-space-borderLight">
                    ${dayVisits.map(v => {
                      const w = wardMap[v.wardId];
                      return `
                        <tr class="hover:bg-space-panel/50">
                          <td class="p-3 font-display font-bold text-space-graphite whitespace-nowrap">${escapeHTML(w ? w.stationNumber : '—')}</td>
                          <td class="p-3 text-space-slate">${escapeHTML(w ? w.location : '—')}</td>

                          <td class="p-3 text-space-slate">${escapeHTML(v.note || '—')}</td>
                          <td class="p-3 text-space-slate whitespace-nowrap">${escapeHTML(w ? (w.contactName || '—') : '—')}</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </section>

          <!-- JSON BACKUP & RESTORE -->
          <section class="sf-module">
            <div class="sf-module-header">
              <span class="sf-label">SYSTEM-SICHERUNG &amp; WIEDERHERSTELLUNG (.JSON)</span>
            </div>
            <div class="p-5 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
              <p class="text-xs sm:text-sm text-space-slate max-w-2xl">
                Erstellen Sie eine vollständige Offline-Sicherung Ihrer Stationen, Rundgänge und Einstellungen oder stellen Sie einen gesicherten Stand wieder her.
              </p>
              <div class="flex flex-wrap gap-3 shrink-0">
                <button type="button" id="exp-json-btn" class="touch-btn px-4 py-2.5 border border-space-border bg-white hover:bg-space-panel font-display text-xs font-bold uppercase tracking-wider text-space-graphite">
                  JSON-Backup speichern
                </button>
                <label class="touch-btn px-4 py-2.5 border border-space-graphite bg-space-graphite hover:bg-space-teal text-white font-display text-xs font-bold uppercase tracking-wider flex items-center cursor-pointer">
                  <span>JSON-Backup laden</span>
                  <input type="file" id="imp-json-input" accept=".json,application/json" class="hidden" />
                </label>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    /* ==========================================================================
       10. MAIN RENDER ORCHESTRATOR & EVENT BINDINGS
       ========================================================================== */
    function renderApp() {
      const app = document.getElementById('app');
      if (!app) return;

      let mainContent = '';
      switch (state.ui.activeTab) {
        case 'MISSION_CONTROL':
          mainContent = renderMissionControl();
          break;
        case 'STATIONS':
          mainContent = renderStationsView();
          break;
        case 'WARD_DETAIL':
          mainContent = renderWardDetailView();
          break;
        case 'WALK_MODE':
          mainContent = renderWalkMode();
          break;
        case 'RUNDGAENGE':
          mainContent = renderRundgaengeView();
          break;
        case 'EXPORT':
          mainContent = renderExportView();
          break;
        case 'SETTINGS':
          mainContent = renderSettingsView();
          break;
        default:
          mainContent = renderMissionControl();
      }

      app.innerHTML = `
        ${renderHeader()}
        ${state.ui.activeTab !== 'WALK_MODE' ? renderNavigation() : ''}
        <main class="flex-1">
          ${mainContent}
        </main>
      `;

      bindEvents();
    }

    function bindEvents() {
      // Header Walk Mode launch/exit
      const launchWalkBtn = document.getElementById('btn-launch-walk-header');
      if (launchWalkBtn) launchWalkBtn.addEventListener('click', () => startWalkMode());

      const exitWalkHeaderBtn = document.getElementById('btn-exit-walk-header');
      if (exitWalkHeaderBtn) {
        exitWalkHeaderBtn.addEventListener('click', () => {
          state.ui.activeTab = 'MISSION_CONTROL';
          renderApp();
        });
      }

      // Navigation Tabs
      document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.ui.activeTab = btn.getAttribute('data-nav');
          renderApp();
        });
      });

      // MISSION CONTROL bindings
      const mcWalk = document.getElementById('mc-start-walk');
      if (mcWalk) mcWalk.addEventListener('click', () => startWalkMode());

      const mcAddWard = document.getElementById('mc-add-ward');
      if (mcAddWard) mcAddWard.addEventListener('click', openAddWardModal);

      const mcStations = document.getElementById('mc-open-stations');
      if (mcStations) mcStations.addEventListener('click', () => {
        state.ui.activeTab = 'STATIONS';
        renderApp();
      });

      const mcExport = document.getElementById('mc-open-export');
      if (mcExport) mcExport.addEventListener('click', () => {
        state.ui.activeTab = 'EXPORT';
        renderApp();
      });

      const mcAllLogs = document.getElementById('mc-view-all-logs');
      if (mcAllLogs) mcAllLogs.addEventListener('click', () => {
        state.ui.activeTab = 'RUNDGAENGE';
        renderApp();
      });

      document.querySelectorAll('.mc-activity-row').forEach(row => {
        row.addEventListener('click', () => {
          const wId = row.getAttribute('data-open-ward');
          if (wId) openWardDetail(wId, 'HISTORY');
        });
      });

      // STATIONS DIRECTORY bindings
      const stAddBtn = document.getElementById('st-add-ward-btn');
      if (stAddBtn) stAddBtn.addEventListener('click', openAddWardModal);

      const stSearch = document.getElementById('st-search-input');
      if (stSearch) {
        stSearch.addEventListener('input', (e) => {
          const pos = e.target.selectionStart;
          state.ui.stationSearch = e.target.value;
          renderApp();
          const newInput = document.getElementById('st-search-input');
          if (newInput) {
            newInput.focus();
            newInput.setSelectionRange(pos, pos);
          }
        });
      }

      const stSort = document.getElementById('st-sort-select');
      if (stSort) {
        stSort.addEventListener('change', (e) => {
          const val = e.target.value;
          if (val === 'NUMBER_ASC') { state.ui.stationSortBy = 'NUMBER'; state.ui.stationSortDir = 'ASC'; }
          else if (val === 'NUMBER_DESC') { state.ui.stationSortBy = 'NUMBER'; state.ui.stationSortDir = 'DESC'; }
          else if (val === 'LAST_VISIT_DESC') { state.ui.stationSortBy = 'LAST_VISIT'; state.ui.stationSortDir = 'DESC'; }
          else if (val === 'LAST_VISIT_ASC') { state.ui.stationSortBy = 'LAST_VISIT'; state.ui.stationSortDir = 'ASC'; }
          renderApp();
        });
      }

      document.querySelectorAll('.st-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.ui.stationFilter = btn.getAttribute('data-st-filter');
          renderApp();
        });
      });

      document.querySelectorAll('.ward-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.quick-visit-btn')) return;
          openWardDetail(card.getAttribute('data-ward-card'), 'OVERVIEW');
        });
      });

      document.querySelectorAll('.quick-visit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          openWardDetail(btn.getAttribute('data-quick-visit'), 'QUICK_ENTRY');
        });
      });

      // WARD DETAIL bindings
      const wdBack = document.getElementById('wd-back-btn');
      if (wdBack) wdBack.addEventListener('click', () => {
        state.ui.activeTab = 'STATIONS';
        renderApp();
      });

      const wdPrev = document.getElementById('wd-prev-btn');
      if (wdPrev) {
        wdPrev.addEventListener('click', () => {
          const sorted = getSortedWardsList();
          const idx = sorted.findIndex(w => w.id === state.ui.selectedWardId);
          if (idx > 0) openWardDetail(sorted[idx - 1].id, state.ui.wardDetailTab);
        });
      }

      const wdNext = document.getElementById('wd-next-btn');
      if (wdNext) {
        wdNext.addEventListener('click', () => {
          const sorted = getSortedWardsList();
          const idx = sorted.findIndex(w => w.id === state.ui.selectedWardId);
          if (idx >= 0 && idx < sorted.length - 1) openWardDetail(sorted[idx + 1].id, state.ui.wardDetailTab);
        });
      }

      const wdDelWard = document.getElementById('wd-delete-ward-btn');
      if (wdDelWard) wdDelWard.addEventListener('click', () => deleteWardWithConfirm(state.ui.selectedWardId));

      document.querySelectorAll('.wd-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.getAttribute('data-wd-tab');
          openWardDetail(state.ui.selectedWardId, tab);
        });
      });

      // Ward Overview Edit Form
      const wdEditForm = document.getElementById('wd-edit-form');
      if (wdEditForm) {
        wdEditForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const ward = state.wards.find(w => w.id === state.ui.selectedWardId);
          if (!ward) return;
          const fd = new FormData(wdEditForm);
          const newNum = fd.get('stationNumber').trim();
          const newLoc = fd.get('location').trim();
          const newMail = fd.get('mailboxLocation').trim();

          const errEl = document.getElementById('wd-edit-error');
          if (!newNum || !newLoc || !newMail) {
            errEl.textContent = 'Stationsnummer, Standort und Postfach-Ort dürfen nicht leer sein.';
            errEl.classList.remove('hidden');
            return;
          }

          const dup = state.wards.some(w => w.id !== ward.id && w.stationNumber.trim().toLowerCase() === newNum.toLowerCase());
          if (dup) {
            errEl.textContent = `Stationsnummer "${newNum}" wird bereits von einer anderen Station verwendet.`;
            errEl.classList.remove('hidden');
            return;
          }

          ward.stationNumber = newNum;
          ward.wardName = fd.get('wardName').trim();
          ward.location = newLoc;
          ward.mailboxLocation = newMail;
          ward.contactName = fd.get('contactName').trim();
          ward.contactRole = fd.get('contactRole').trim();
          ward.contactInfo = fd.get('contactInfo').trim();
          ward.contactNotes = fd.get('contactNotes').trim();
          ward.notes = fd.get('notes').trim();

          saveState();
          showToast('Stationsdaten gespeichert.', 'success');
          renderApp();
        });
      }

      const wdGotoQe = document.getElementById('wd-goto-qe-btn');
      if (wdGotoQe) wdGotoQe.addEventListener('click', () => openWardDetail(state.ui.selectedWardId, 'QUICK_ENTRY'));

      const wdHistAdd = document.getElementById('wd-hist-add-btn');
      if (wdHistAdd) wdHistAdd.addEventListener('click', () => openWardDetail(state.ui.selectedWardId, 'QUICK_ENTRY'));

      const wdHistEmptyAdd = document.getElementById('wd-hist-empty-add');
      if (wdHistEmptyAdd) wdHistEmptyAdd.addEventListener('click', () => openWardDetail(state.ui.selectedWardId, 'QUICK_ENTRY'));

      // Ward Quick Entry bindings
      const qeDateInput = document.getElementById('qe-date-input');
      if (qeDateInput) qeDateInput.addEventListener('change', (e) => { state.ui.qeDate = e.target.value; });

      const qeTodayBtn = document.getElementById('qe-date-today');
      if (qeTodayBtn) qeTodayBtn.addEventListener('click', () => { state.ui.qeDate = getTodayISO(); renderApp(); });

      const qeYesterdayBtn = document.getElementById('qe-date-yesterday');
      if (qeYesterdayBtn) qeYesterdayBtn.addEventListener('click', () => { state.ui.qeDate = getOffsetDateISO(-1); renderApp(); });

      document.querySelectorAll('.qe-status-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.ui.qeStatus = btn.getAttribute('data-qe-status');
          if (state.ui.qeStatus === 'BROAD_CONSENT' && state.ui.qeCount === 0) state.ui.qeCount = 1;
          renderApp();
        });
      });

      const qeDec = document.getElementById('qe-dec-btn');
      if (qeDec) qeDec.addEventListener('click', () => { state.ui.qeCount = Math.max(0, state.ui.qeCount - 1); renderApp(); });

      const qeInc = document.getElementById('qe-inc-btn');
      if (qeInc) qeInc.addEventListener('click', () => { state.ui.qeCount += 1; renderApp(); });

      const qeCountInput = document.getElementById('qe-count-input');
      if (qeCountInput) {
        qeCountInput.addEventListener('input', (e) => {
          state.ui.qeCount = Math.max(0, parseInt(e.target.value, 10) || 0);
        });
      }

      document.querySelectorAll('.qe-quick-add').forEach(btn => {
        btn.addEventListener('click', () => {
          state.ui.qeCount += parseInt(btn.getAttribute('data-qe-add'), 10) || 0;
          renderApp();
        });
      });

      const qeNoteInput = document.getElementById('qe-note-input');
      if (qeNoteInput) {
        qeNoteInput.addEventListener('input', (e) => { state.ui.qeNote = e.target.value; });
      }

      document.querySelectorAll('.qe-note-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          const text = btn.getAttribute('data-qe-chip');
          state.ui.qeNote = state.ui.qeNote ? `${state.ui.qeNote} ${text}` : text;
          renderApp();
        });
      });

      const qeSaveBtn = document.getElementById('qe-save-btn');
      if (qeSaveBtn) {
        qeSaveBtn.addEventListener('click', () => {
          const ward = state.wards.find(w => w.id === state.ui.selectedWardId);
          if (!ward) return;
          addVisitRecord({
            wardId: ward.id,
            date: state.ui.qeDate || getTodayISO(),
            status: state.ui.qeStatus,
            consentCount: state.ui.qeCount,
            note: state.ui.qeNote
          });
          showToast(`Rundgang für ${ward.stationNumber} gespeichert.`, 'success');
          openWardDetail(ward.id, 'HISTORY');
        });
      }

      const qeSaveNextBtn = document.getElementById('qe-save-next-btn');
      if (qeSaveNextBtn) {
        qeSaveNextBtn.addEventListener('click', () => {
          const sorted = getSortedWardsList();
          const idx = sorted.findIndex(w => w.id === state.ui.selectedWardId);
          const ward = sorted[idx];
          if (!ward) return;
          addVisitRecord({
            wardId: ward.id,
            date: state.ui.qeDate || getTodayISO(),
            status: state.ui.qeStatus,
            consentCount: state.ui.qeCount,
            note: state.ui.qeNote
          });
          const nextWard = sorted[idx + 1];
          if (nextWard) {
            showToast(`${ward.stationNumber} gespeichert → Weiter zu ${nextWard.stationNumber}`, 'success');
            openWardDetail(nextWard.id, 'QUICK_ENTRY');
          } else {
            showToast(`${ward.stationNumber} gespeichert.`, 'success');
            openWardDetail(ward.id, 'HISTORY');
          }
        });
      }

      // WALK MODE bindings
      const wmExit = document.getElementById('wm-exit-btn');
      if (wmExit) wmExit.addEventListener('click', () => { state.ui.activeTab = 'MISSION_CONTROL'; renderApp(); });

      const wmAddWard = document.getElementById('wm-add-ward');
      if (wmAddWard) wmAddWard.addEventListener('click', openAddWardModal);

      document.querySelectorAll('.wm-pill-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.ui.walkWardId = btn.getAttribute('data-wm-select');
          state.ui.walkStatus = 'BROAD_CONSENT';
          state.ui.walkCount = 1;
          state.ui.walkNote = '';
          renderApp();
        });
      });

      const wmOpenDetail = document.getElementById('wm-open-detail-btn');
      if (wmOpenDetail) {
        wmOpenDetail.addEventListener('click', () => openWardDetail(state.ui.walkWardId, 'OVERVIEW'));
      }

      const wmDateInput = document.getElementById('wm-date-input');
      if (wmDateInput) wmDateInput.addEventListener('change', (e) => { state.ui.walkDate = e.target.value; });

      document.querySelectorAll('.wm-status-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.ui.walkStatus = btn.getAttribute('data-wm-status');
          if (state.ui.walkStatus === 'BROAD_CONSENT' && state.ui.walkCount === 0) state.ui.walkCount = 1;
          renderApp();
        });
      });

      const wmDec = document.getElementById('wm-dec-btn');
      if (wmDec) wmDec.addEventListener('click', () => { state.ui.walkCount = Math.max(0, state.ui.walkCount - 1); renderApp(); });

      const wmInc = document.getElementById('wm-inc-btn');
      if (wmInc) wmInc.addEventListener('click', () => { state.ui.walkCount += 1; renderApp(); });

      const wmCountInput = document.getElementById('wm-count-input');
      if (wmCountInput) {
        wmCountInput.addEventListener('input', (e) => {
          state.ui.walkCount = Math.max(0, parseInt(e.target.value, 10) || 0);
        });
      }

      document.querySelectorAll('.wm-quick-add').forEach(btn => {
        btn.addEventListener('click', () => {
          state.ui.walkCount += parseInt(btn.getAttribute('data-wm-add'), 10) || 0;
          renderApp();
        });
      });

      const wmNoteInput = document.getElementById('wm-note-input');
      if (wmNoteInput) {
        wmNoteInput.addEventListener('input', (e) => { state.ui.walkNote = e.target.value; });
      }

      document.querySelectorAll('.wm-note-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          const text = btn.getAttribute('data-wm-chip');
          state.ui.walkNote = state.ui.walkNote ? `${state.ui.walkNote} ${text}` : text;
          renderApp();
        });
      });

      const wmSaveNext = document.getElementById('wm-save-next-btn');
      if (wmSaveNext) {
        wmSaveNext.addEventListener('click', () => {
          const sorted = getSortedWardsList();
          const idx = sorted.findIndex(w => w.id === state.ui.walkWardId);
          const ward = sorted[idx];
          if (!ward) return;

          addVisitRecord({
            wardId: ward.id,
            date: state.ui.walkDate || getTodayISO(),
            status: state.ui.walkStatus,
            consentCount: state.ui.walkCount,
            note: state.ui.walkNote
          });

          const nextWard = sorted[(idx + 1) % sorted.length];
          state.ui.walkWardId = nextWard.id;
          state.ui.walkStatus = 'BROAD_CONSENT';
          state.ui.walkCount = 1;
          state.ui.walkNote = '';
          showToast(`${ward.stationNumber} gespeichert → Nächste: ${nextWard.stationNumber}`, 'success');
          renderApp();
        });
      }

      const wmSkip = document.getElementById('wm-skip-btn');
      if (wmSkip) {
        wmSkip.addEventListener('click', () => {
          const sorted = getSortedWardsList();
          const idx = sorted.findIndex(w => w.id === state.ui.walkWardId);
          const nextWard = sorted[(idx + 1) % sorted.length];
          state.ui.walkWardId = nextWard.id;
          state.ui.walkStatus = 'BROAD_CONSENT';
          state.ui.walkCount = 1;
          state.ui.walkNote = '';
          renderApp();
        });
      }

      // GLOBAL RUNDGÄNGE LOG bindings
      const logReset = document.getElementById('log-reset-filters');
      if (logReset) {
        logReset.addEventListener('click', () => {
          state.ui.logDateFilter = '';
          state.ui.logStationFilter = 'ALL';
          state.ui.logStatusFilter = 'ALL';
          state.ui.logSearch = '';
          renderApp();
        });
      }

      const logDateIn = document.getElementById('log-date-input');
      if (logDateIn) logDateIn.addEventListener('change', (e) => { state.ui.logDateFilter = e.target.value; renderApp(); });

      const logStationSel = document.getElementById('log-station-select');
      if (logStationSel) logStationSel.addEventListener('change', (e) => { state.ui.logStationFilter = e.target.value; renderApp(); });

      const logStatusSel = document.getElementById('log-status-select');
      if (logStatusSel) logStatusSel.addEventListener('change', (e) => { state.ui.logStatusFilter = e.target.value; renderApp(); });

      const logSearchIn = document.getElementById('log-search-input');
      if (logSearchIn) {
        logSearchIn.addEventListener('input', (e) => {
          const pos = e.target.selectionStart;
          state.ui.logSearch = e.target.value;
          renderApp();
          const el = document.getElementById('log-search-input');
          if (el) { el.focus(); el.setSelectionRange(pos, pos); }
        });
      }

      document.querySelectorAll('.log-ward-link').forEach(btn => {
        btn.addEventListener('click', () => openWardDetail(btn.getAttribute('data-open-ward'), 'OVERVIEW'));
      });

      // Shared Edit & Delete Visit Buttons (Ward History + Global Log)
      document.querySelectorAll('.edit-visit-btn').forEach(btn => {
        btn.addEventListener('click', () => openEditVisitModal(btn.getAttribute('data-edit-visit')));
      });

      document.querySelectorAll('.delete-visit-btn').forEach(btn => {
        btn.addEventListener('click', () => deleteVisitWithUndo(btn.getAttribute('data-delete-visit')));
      });

      // DATA / EXPORT bindings
      const expComplete = document.getElementById('exp-complete-btn');
      if (expComplete) expComplete.addEventListener('click', exportCompleteXLSX);

      const expDateIn = document.getElementById('exp-date-input');
      if (expDateIn) expDateIn.addEventListener('change', (e) => { state.ui.exportDate = e.target.value; renderApp(); });

      document.querySelectorAll('.exp-quick-date').forEach(btn => {
        btn.addEventListener('click', () => {
          state.ui.exportDate = btn.getAttribute('data-exp-quick-date');
          renderApp();
        });
      });

      const expDayBtn = document.getElementById('exp-day-btn');
      if (expDayBtn) expDayBtn.addEventListener('click', () => exportDayXLSX(state.ui.exportDate));

      const expJsonBtn = document.getElementById('exp-json-btn');
      if (expJsonBtn) expJsonBtn.addEventListener('click', exportJSONBackup);

      const impJsonInput = document.getElementById('imp-json-input');
      if (impJsonInput) {
        impJsonInput.addEventListener('change', (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const parsed = JSON.parse(evt.target.result);
              if (!Array.isArray(parsed.wards) || !Array.isArray(parsed.visits)) {
                showToast('Ungültiges Backup-Dateiformat.', 'error');
                return;
              }
              showConfirmModal({
                title: 'BACKUP WIEDERHERSTELLEN',
                message: `Möchten Sie ${parsed.wards.length} Stationen und ${parsed.visits.length} Rundgänge aus dem Backup laden? Aktuelle Daten werden dabei ersetzt.`,
                confirmText: 'Backup wiederherstellen',
                danger: false,
                onConfirm: () => {
                  state.wards = parsed.wards;
                  state.visits = parsed.visits;
                  if (parsed.settings) state.settings = { ...state.settings, ...parsed.settings };
                  saveState();
                  renderApp();
                  showToast('Backup erfolgreich wiederhergestellt.', 'success');
                }
              });
            } catch (err) {
              showToast('Fehler beim Lesen der JSON-Datei.', 'error');
            }
          };
          reader.readAsText(file);
        });
      }

      // SETTINGS bindings
      const settingsForm = document.getElementById('settings-form');
      if (settingsForm) {
        settingsForm.addEventListener('submit', (e) => {
          e.preventDefault();
          state.settings.facilityName = document.getElementById('set-facility').value.trim() || 'ZKIMED FORSCHUNGSKLINIKUM';
          state.settings.surveyTitle = document.getElementById('set-survey').value.trim() || 'BROAD CONSENT SURVEY';
          saveState();
          renderApp();
          showToast('Terminal-Konfiguration gespeichert.', 'success');
        });
      }

      const addChipBtn = document.getElementById('set-add-chip-btn');
      if (addChipBtn) {
        addChipBtn.addEventListener('click', () => {
          const input = document.getElementById('set-new-chip');
          const val = input.value.trim();
          if (!val) return;
          state.settings.quickNotes.push(val);
          saveState();
          renderApp();
          showToast('Schnellnotiz-Vorlage hinzugefügt.', 'success');
        });
      }

      document.querySelectorAll('.del-chip-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-del-chip'), 10);
          state.settings.quickNotes.splice(idx, 1);
          saveState();
          renderApp();
          showToast('Vorlage entfernt.', 'info');
        });
      });

      const reloadDemoBtn = document.getElementById('set-reload-demo');
      if (reloadDemoBtn) {
        reloadDemoBtn.addEventListener('click', () => {
          showConfirmModal({
            title: 'DEMODATEN WIEDERHERSTELLEN',
            message: 'Alle aktuellen Stationen und Rundgänge werden durch die 6 ZKIMED-Demostationen ersetzt. Fortfahren?',
            confirmText: 'Demodaten laden',
            danger: true,
            onConfirm: () => {
              const demo = createDemoData();
              state.wards = demo.wards;
              state.visits = demo.visits;
              saveState();
              state.ui.activeTab = 'MISSION_CONTROL';
              renderApp();
              showToast('Demodaten wurden geladen.', 'success');
            }
          });
        });
      }

      const clearAllBtn = document.getElementById('set-clear-all');
      if (clearAllBtn) {
        clearAllBtn.addEventListener('click', () => {
          showConfirmModal({
            title: 'ALLE DATEN LÖSCHEN',
            message: 'Möchten Sie wirklich alle Stationen und Rundgänge unwiderruflich löschen, um mit einer leeren Datenbank zu starten?',
            confirmText: 'Alles löschen',
            danger: true,
            onConfirm: () => {
              state.wards = [];
              state.visits = [];
              saveState();
              state.ui.activeTab = 'MISSION_CONTROL';
              renderApp();
              showToast('Alle Stations- und Rundgangdaten wurden gelöscht.', 'info');
            }
          });
        });
      }
    }

    // Boot terminal on DOMContentLoaded
    document.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderApp();
    });
  </script>
</body>
</html>
