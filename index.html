<!DOCTYPE html>
<html lang="de">
<head>

  <script>

  <!-- SheetJS for real .xlsx Excel export -->

  <style>
    /* ==========================================================================
       STARFIELD / LUNAR RESEARCH TERMINAL DESIGN SYSTEM
       ========================================================================== */
    :root {
      --bg-primary: #ECEEED;
      --bg-surface: #FAFBFB;
      --bg-metal: #DFE3E2;
      --border-main: #8A9194;
      --border-subtle: #B8BFC2;
      --text-primary: #1E2326;
      --text-secondary: #525B60;
      --text-teal: #5A686B;
      --accent-red: #C8193B;
      --accent-green: #1E7E56;
      --accent-amber: #C97A16;
      --accent-bluegrey: #5B7078;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(200, 25, 59, 0.12);
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      /* Starfield technical dot-grid background */
      background-image:
        radial-gradient(#B5BCBF 1px, transparent 1px),
        linear-gradient(to right, rgba(138, 145, 148, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(138, 145, 148, 0.06) 1px, transparent 1px);
      background-size: 24px 24px, 96px 96px, 96px 96px;
      background-position: 0 0, 0 0, 0 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Starfield-inspired framed module with inline top-border header */
    .sf-module {
      position: relative;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-main);
      border-radius: 2px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.85), 0 2px 6px rgba(30, 35, 38, 0.04);
    }

    .sf-module-header {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 0.9rem;
      border-bottom: 1px solid var(--border-subtle);
      background: linear-gradient(180deg, #F3F5F4 0%, #E9ECEB 100%);
    }

    .sf-module-header::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 14px;
      background-color: var(--text-teal);
      flex-shrink: 0;
    }

    .sf-module-header.accent-red::before {
      background-color: var(--accent-red);
    }

    .sf-module-header.accent-green::before {
      background-color: var(--accent-green);
    }

    .sf-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--text-teal);
    }

    /* Starfield Research Lab Diagonal Hatched Stripes (Standby / Empty states) */
    .sf-stripes {
      background-color: #E3E7E6;
      background-image: repeating-linear-gradient(
        -45deg,
        #E4E8E7,
        #E4E8E7 10px,
        #D1D7D6 10px,
        #D1D7D6 20px
      );
      border: 1px solid var(--border-subtle);
    }

    /* Starware-inspired vertical architectural bar accent */
    .starware-bars {
      display: flex;
      gap: 3px;
      height: 22px;
      align-items: flex-end;
    }
    .starware-bars span {
      display: block;
      width: 4px;
      background-color: #5A686B;
    }

    /* Corner reticle ticks for active / selected items */
    .sf-reticle {
      position: relative;
    }
    .sf-reticle::before,
    .sf-reticle::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      pointer-events: none;
    }
    .sf-reticle::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid var(--accent-red);
      border-left: 2px solid var(--accent-red);
    }
    .sf-reticle::after {
      bottom: -1px;
      right: -1px;
      border-bottom: 2px solid var(--accent-red);
      border-right: 2px solid var(--accent-red);
    }

    /* Tablet-first touch controls */
    .touch-btn {
      min-height: 48px;
      border-radius: 2px;
      transition: background-color 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
      user-select: none;
    }
    .touch-btn:active {
      transform: translateY(1px);
    }

    .touch-input {
      min-height: 48px;
      border-radius: 2px;
      border: 1px solid var(--border-main);
      background-color: #FFFFFF;
      color: var(--text-primary);
      padding: 0.65rem 0.85rem;
      font-size: 1rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .touch-input:focus {
      outline: none;
      border-color: var(--accent-red);
      box-shadow: 0 0 0 2px rgba(200, 25, 59, 0.16);
    }

    /* Custom scrollbar for horizontal station strips */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Subtle pulse for live telemetry dot */
    @keyframes telemetryPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .telemetry-dot {
      animation: telemetryPulse 2.4s infinite ease-in-out;
    }
  </style>
</head>

  <script>
    /* ==========================================================================
       1. CONSTANTS, STATUS DEFINITIONS & SEED DATA
       ========================================================================== */
    const STORAGE_KEY = 'zkimed_consent_terminal_v1';

    const VISIT_STATUS = {
      LEER: {
        key: 'LEER',
        label: 'Leer',
        shortLabel: 'LEER',
        code: 'STS-00',
        bgClass: 'bg-zkimed-bluegreyLight',
        textClass: 'text-zkimed-bluegrey',

        dotColor: '#5B7078'
      },
      BROAD_CONSENT: {
        key: 'BROAD_CONSENT',
        label: 'Broad Consent eingesammelt',
        shortLabel: 'BROAD CONSENT',
        code: 'STS-01',
        bgClass: 'bg-zkimed-greenLight',
        textClass: 'text-zkimed-green',
        borderClass: 'border-zkimed-green',
        dotColor: '#1E7E56'
      },
      UNINFORMIERT: {
        key: 'UNINFORMIERT',
        label: 'Uninformiert',
        shortLabel: 'UNINFORMIERT',
        code: 'STS-02',
        bgClass: 'bg-zkimed-amberLight',
        textClass: 'text-zkimed-amber',
        borderClass: 'border-zkimed-amber',
        dotColor: '#C97A16'
      }

    const DEFAULT_QUICK_NOTES = [
      'Ansprechpartner nicht anwesend.',
      'Postfach heute kontrolliert.',
      'Neue Unterlagen hinterlegt.',
      'Rückkehr am Donnerstag empfohlen.',
      'Zwei Patienten informiert, keine Einwilligung erhalten.'

    /* ==========================================================================
       2. DATE & UTILITY HELPERS
       ========================================================================== */
    function getTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getOffsetDateISO(daysOffset) {
      const d = new Date();
      d.setDate(d.getDate() + daysOffset);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatDateDE(isoStr) {
      if (!isoStr || typeof isoStr !== 'string') return '—';
      const parts = isoStr.split('-');
      if (parts.length !== 3) return isoStr;
      return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }

    function generateId(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).substring(2, 7)}`;
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function createDemoData() {
      const today = getTodayISO();
      const yesterday = getOffsetDateISO(-1);
      const twoDaysAgo = getOffsetDateISO(-2);
      const fourDaysAgo = getOffsetDateISO(-4);

      const wards = [
        {
          id: 'ward_12',
          stationNumber: 'Station 12',
          wardName: 'Kardiologie & Angiologie',
          location: 'Haus A · Ebene 2 · Nordflügel',
          mailboxLocation: 'Eingang rechts neben dem Pflegestützpunkt (Fach 12)',

          contactRole: 'Studienärztin / Oberärztin',
          contactInfo: 'Tel. -4412 · k.weber@zkimed-klinik.de',
          contactNotes: 'Dienstags und donnerstags ab 11:30 Uhr nach der Visite gut erreichbar.',
          notes: 'Beste Besuchszeit zwischen 11:00 und 13:30 Uhr. Aufklärungsbögen im blauen Ordner am Stützpunkt nachfüllen.'
        },
        {
          id: 'ward_14a',
          stationNumber: 'Station 14A',
          wardName: 'Neurologie & Stroke Unit',
          location: 'Haus A · Ebene 4 · Südflügel',
          mailboxLocation: 'Raum 4.14 · Ablagefach hinter dem Stationssekretariat',
          contactName: 'Thomas Berger',
          contactRole: 'Stationsleitung Pflege',
          contactInfo: 'Tel. -4820',
          contactNotes: 'Sehr kooperativ, sammelt unterschriebene Bögen direkt im Sekretariat.',
          notes: 'Zugang zur Stroke Unit nur nach kurzer Anmeldung am Empfang. Hygienevorschriften beachten.'
        },
        {
          id: 'ward_21',
          stationNumber: 'Station 21',
          wardName: 'Onkologie & Hämatologie',
          location: 'Haus B · Ebene 1 · Osttrakt',
          mailboxLocation: 'Empfangstresen · Verschlossenes Forschungsfach B1',
          contactName: 'OA Dr. Markus Lindner',
          contactRole: 'Forschungskoordinator Onkologie',
          contactInfo: 'Tel. -5109 · m.lindner@zkimed-klinik.de',
          contactNotes: 'Preferiert kurze Übergabe am frühen Nachmittag.',
          notes: 'Hohe Teilnahmebereitschaft bei ambulanten und stationären Patienten. Immer 15 Ersatz-Kits mitführen.'
        },
        {
          id: 'ward_04',
          stationNumber: 'Station 04',
          wardName: 'Allgemein- & Viszeralchirurgie',
          location: 'Zentralbau · Erdgeschoss · Sektor C',
          mailboxLocation: 'Flur C · Wandpostfach gegenüber Arztzimmer 0.08',
          contactName: 'Sabine Hoffmann',
          contactRole: 'Case Managerin',
          contactInfo: 'Tel. -3204',
          contactNotes: 'Mittwochs ab 14:00 Uhr nicht im Haus.',
          notes: 'Vormittags oft OP-Vorbereitungen; präoperative Patienten am besten am Nachmittag besuchen.'
        },
        {
          id: 'ward_18',
          stationNumber: 'Station 18',
          wardName: 'Pneumologie & Beatmungsmedizin',
          location: 'Haus B · Ebene 3 · Westflügel',
          mailboxLocation: 'Stationszimmer 3.22 · Hängeregister "Studien"',
          contactName: 'Dr. med. Lukas Reimann',
          contactRole: 'Assistenzarzt',
          contactInfo: 'Tel. -5318',
          contactNotes: 'Bittet um kurze Info per Telefon vor Eintreffen.',
          notes: 'Isolationszimmer am Flurende beachten. Schutzkleidung liegt vor Zimmer 3.28 bereit.'
        },
        {
          id: 'ward_07',
          stationNumber: 'Station 07',
          wardName: 'Nephrologie & Dialyse',
          location: 'Haus C · Ebene 1 · Süd',
          mailboxLocation: 'Anmeldung Dialyse · Ablagekorb rot',
          contactName: 'Miriam Scholz',
          contactRole: 'Leitende Dialyse-Fachkraft',
          contactInfo: 'Tel. -6107',
          contactNotes: 'Vormittagsschicht bis 13:00 Uhr.',
          notes: 'Patienten während der Dialyse ruhig ansprechbar, ausreichend Zeit für Fragen einplanen.'
        }
      ];

      const visits = [
        {
          id: 'vis_01',
          wardId: 'ward_12',
          date: fourDaysAgo,

          consentCount: 3,

          createdAt: Date.now() - 345600000
        },
        {
          id: 'vis_02',
          wardId: 'ward_12',
          date: today,
          status: 'BROAD_CONSENT',
          consentCount: 4,
          note: 'Postfach heute kontrolliert. Neue Unterlagen hinterlegt.',
          createdAt: Date.now() - 7200000
        },
        {
          id: 'vis_03',
          wardId: 'ward_14a',
          date: twoDaysAgo,
          status: 'UNINFORMIERT',
          consentCount: 0,
          note: 'Zwei Patienten informiert, keine Einwilligung erhalten.',
          createdAt: Date.now() - 172800000
        },
        {
          id: 'vis_04',
          wardId: 'ward_14a',
          date: today,
          status: 'BROAD_CONSENT',
          consentCount: 2,
          note: 'Rücksprache mit Thomas Berger erfolgreich.',
          createdAt: Date.now() - 5400000
        },
        {
          id: 'vis_05',
          wardId: 'ward_21',
          date: yesterday,
          status: 'BROAD_CONSENT',
          consentCount: 5,
          note: 'Sehr guter Rücklauf auf Station 21, neue Aufklärungsbögen hinterlegt.',
          createdAt: Date.now() - 86400000
        },
        {
          id: 'vis_06',
          wardId: 'ward_04',
          date: yesterday,
          status: 'LEER',
          consentCount: 0,
          note: 'Postfach heute kontrolliert. Ansprechpartner nicht anwesend.',
          createdAt: Date.now() - 82800000
        }
        // Station 18 and Station 07 intentionally have 0 visits so "NOCH NICHT BESUCHT" is demonstrable right away
      ];

      return {
        wards,
        visits,
        settings: {
          surveyTitle: 'BROAD CONSENT SURVEY · LUNAR-MED',
          facilityName: 'ZKIMED FORSCHUNGSKLINIKUM',
          quickNotes: [...DEFAULT_QUICK_NOTES]
        }
      };
    }

    /* ==========================================================================
       3. APPLICATION STATE & OFFLINE-FIRST STORAGE ENGINE
       ========================================================================== */
    const state = {
      wards: [],
      visits: [],
      settings: {
        surveyTitle: 'BROAD CONSENT SURVEY · LUNAR-MED',
        facilityName: 'ZKIMED FORSCHUNGSKLINIKUM',
        quickNotes: [...DEFAULT_QUICK_NOTES]
      },
      ui: {
        activeTab: 'MISSION_CONTROL', // MISSION_CONTROL | STATIONS | WARD_DETAIL | WALK_MODE | RUNDGAENGE | EXPORT | SETTINGS
        selectedWardId: null,
        wardDetailTab: 'OVERVIEW', // OVERVIEW | HISTORY | QUICK_ENTRY
        // Quick Entry draft state
        qeDate: getTodayISO(),
        qeStatus: 'BROAD_CONSENT',
        qeCount: 1,
        qeNote: '',
        // Walk Mode state
        walkWardId: null,
        walkDate: getTodayISO(),
        walkStatus: 'BROAD_CONSENT',
        walkCount: 1,
        walkNote: '',
        // Stations directory filters & sort
        stationSearch: '',
        stationFilter: 'ALL', // ALL | UNVISITED | VISITED_TODAY
        stationSortBy: 'NUMBER', // NUMBER | LAST_VISIT
        stationSortDir: 'ASC', // ASC | DESC
        // Global Rundgänge log filters
        logDateFilter: '',
        logStationFilter: 'ALL',
        logStatusFilter: 'ALL',
        logSearch: '',
        // Export state
        exportDate: getTodayISO(),
        // Save indicator timestamp
        lastSavedTime: null
      }
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const demo = createDemoData();
          state.wards = demo.wards;
          state.visits = demo.visits;
          state.settings = demo.settings;
          saveState(false);
          return;
        }
        const parsed = JSON.parse(raw);
        state.wards = Array.isArray(parsed.wards) ? parsed.wards : [];
        state.visits = Array.isArray(parsed.visits) ? parsed.visits : [];
        if (parsed.settings) {
          state.settings = {
            surveyTitle: parsed.settings.surveyTitle || 'BROAD CONSENT SURVEY · LUNAR-MED',
            facilityName: parsed.settings.facilityName || 'ZKIMED FORSCHUNGSKLINIKUM',
            quickNotes: Array.isArray(parsed.settings.quickNotes) && parsed.settings.quickNotes.length > 0
              ? parsed.settings.quickNotes
              : [...DEFAULT_QUICK_NOTES]
          };
        }
      } catch (err) {
        console.error('Fehler beim Laden aus localStorage:', err);
        const demo = createDemoData();
        state.wards = demo.wards;
        state.visits = demo.visits;
        state.settings = demo.settings;
      }
    }

    function saveState(updateBadge = true) {
      try {
        const payload = {
          version: 1,
          updatedAt: new Date().toISOString(),
          wards: state.wards,
          visits: state.visits,
          settings: state.settings
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        const now = new Date();
        state.ui.lastSavedTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
        if (updateBadge) {
          const badgeEl = document.getElementById('hud-save-indicator');
          if (badgeEl) {
            badgeEl.textContent = `GESPEICHERT · ${state.ui.lastSavedTime}`;
            badgeEl.classList.add('text-zkimed-green');
            setTimeout(() => badgeEl.classList.remove('text-zkimed-green'), 1400);
          }
        }
      } catch (err) {
        console.error('Fehler beim Speichern:', err);
        showToast('Speicherfehler im Browser-Speicher!', 'error');
      }
    }

    /* ==========================================================================
       4. COMPUTED METRICS & SELECTORS
       ========================================================================== */
    function getSortedWardsList() {
      return [...state.wards].sort((a, b) =>
        a.stationNumber.localeCompare(b.stationNumber, 'de', { numeric: true, sensitivity: 'base' })
      );
    }

    function getWardVisits(wardId) {
      return state.visits
        .filter(v => v.wardId === wardId)
        .sort((a, b) => {
          if (b.date !== a.date) return b.date.localeCompare(a.date);
          return (b.createdAt || 0) - (a.createdAt || 0);
        });
    }

    function getWardStats(wardId) {
      const wVisits = getWardVisits(wardId);
      const today = getTodayISO();
      const totalConsents = wVisits.reduce((sum, v) => sum + (v.status === 'BROAD_CONSENT' ? (Number(v.consentCount) || 0) : 0), 0);
      const latestVisit = wVisits.length > 0 ? wVisits[0] : null;
      const visitedToday = wVisits.some(v => v.date === today);
      return {
        visitCount: wVisits.length,
        totalConsents,
        latestVisit,
        visitedToday
      };
    }

    function getGlobalStats() {
      const today = getTodayISO();
      const totalWards = state.wards.length;
      const visitedTodayWardIds = new Set(
        state.visits.filter(v => v.date === today).map(v => v.wardId)
      );
      // Only count wards that still exist
      const existingWardIds = new Set(state.wards.map(w => w.id));
      const visitedTodayCount = [...visitedTodayWardIds].filter(id => existingWardIds.has(id)).length;

      const everVisitedWardIds = new Set(
        state.visits.map(v => v.wardId).filter(id => existingWardIds.has(id))
      );
      const unvisitedWardsCount = Math.max(0, totalWards - everVisitedWardIds.size);

      const totalConsents = state.visits.reduce(
        (sum, v) => sum + (v.status === 'BROAD_CONSENT' ? (Number(v.consentCount) || 0) : 0),
        0
      );

      const todayConsents = state.visits
        .filter(v => v.date === today)
        .reduce((sum, v) => sum + (v.status === 'BROAD_CONSENT' ? (Number(v.consentCount) || 0) : 0), 0);

      const statusBreakdown = {
        BROAD_CONSENT: state.visits.filter(v => v.status === 'BROAD_CONSENT').length,
        LEER: state.visits.filter(v => v.status === 'LEER').length,
        UNINFORMIERT: state.visits.filter(v => v.status === 'UNINFORMIERT').length
      };

      return {
        totalWards,
        visitedTodayCount,
        everVisitedCount: everVisitedWardIds.size,
        unvisitedWardsCount,
        totalConsents,
        todayConsents,
        totalVisits: state.visits.length,
        statusBreakdown
      };
    }

    /* ==========================================================================
       5. ZKIMED EMBLEM SVG & GEOMETRIC ICONS
       ========================================================================== */
    function renderZkimedLogoSVG(sizeClass = 'w-14 h-14') {
      return `
        <svg viewBox="0 0 220 225" class="${sizeClass} shrink-0 select-none" aria-label="ZKIMED Emblem">
          <defs>
            <!-- Left half clip for anatomical brain -->
            <clipPath id="zkimed-left-hemisphere">
              <rect x="0" y="0" width="109" height="190" />
            </clipPath>
            <!-- Right half clip for lunar hemisphere -->
            <clipPath id="zkimed-right-hemisphere">
              <rect x="111" y="0" width="109" height="190" />

    let toastCounter = 0;

    function showToast(message, type = 'success', undoCallback = null) {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const id = `toast_${++toastCounter}`;

      const borderMap = {
        success: 'border-zkimed-green bg-space-surface',
        error: 'border-zkimed-red bg-zkimed-redLight',
        info: 'border-space-teal bg-space-surface'
      };
      const barMap = {
        success: 'bg-zkimed-green',
        error: 'bg-zkimed-red',
        info: 'bg-space-teal'
      };

      const el = document.createElement('div');
      el.id = id;
      el.className = `pointer-events-auto border ${borderMap[type] || borderMap.info} shadow-lg rounded-[2px] overflow-hidden flex items-stretch transition-all duration-200`;
      el.innerHTML = `
        <div class="w-1.5 ${barMap[type] || barMap.info} shrink-0"></div>
        <div class="p-3.5 flex-1 flex items-center justify-between gap-3">
          <div class="text-sm font-medium text-space-graphite">${escapeHTML(message)}</div>
          ${undoCallback ? `<button id="${id}_undo" class="px-3 py-1.5 bg-space-graphite text-white font-display text-xs font-bold uppercase tracking-wider rounded-[2px] hover:bg-zkimed-red shrink-0">Rückgängig</button>` : ''}
        </div>
      `;

      root.appendChild(el);

      if (undoCallback) {
        const undoBtn = document.getElementById(`${id}_undo`);
        if (undoBtn) {
          undoBtn.addEventListener('click', () => {
            undoCallback();
            el.remove();
          });
        }
      }

      setTimeout(() => {
        if (el && el.parentNode) {
          el.style.opacity = '0';
          setTimeout(() => el.remove(), 200);
        }
      }, undoCallback ? 6000 : 3200);
    }

        document.querySelectorAll('.ev-status-btn').forEach(btn => {

          btn.className = `ev-status-btn touch-btn px-4 py-3 border text-left font-semibold flex items-center justify-between ${isSelected ? 'border-space-graphite bg-space-graphite text-white' : 'border-space-border bg-white text-space-graphite hover:bg-space-panel'}`;
        });
        const countWrap = document.getElementById('ev-count-wrapper');
        if (editStatus === 'BROAD_CONSENT') {
          countWrap.classList.remove('hidden');
          if (editCount === 0) {
            editCount = 1;
            document.getElementById('ev-count').value = 1;
          }
        } else {
          countWrap.classList.add('hidden');
        }
      };

      document.querySelectorAll('.ev-status-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          editStatus = btn.getAttribute('data-status');
          updateModalStatusUI();
        });
      });

      document.getElementById('ev-dec').addEventListener('click', () => {
        const input = document.getElementById('ev-count');
        editCount = Math.max(0, (parseInt(input.value, 10) || 0) - 1);
        input.value = editCount;
      });
      document.getElementById('ev-inc').addEventListener('click', () => {
        const input = document.getElementById('ev-count');
        editCount = (parseInt(input.value, 10) || 0) + 1;
        input.value = editCount;
      });

      document.getElementById('modal-close-x').addEventListener('click', closeModal);
      document.getElementById('ev-cancel').addEventListener('click', closeModal);
      document.getElementById('modal-backdrop').addEventListener('click', (e) => {
        if (e.target.id === 'modal-backdrop') closeModal();
      });

      document.getElementById('edit-visit-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const newDate = document.getElementById('ev-date').value || getTodayISO();
        const rawCount = parseInt(document.getElementById('ev-count').value, 10) || 0;
        const newNote = document.getElementById('ev-note').value.trim();

        visit.date = newDate;
        visit.status = editStatus;
        visit.consentCount = editStatus === 'BROAD_CONSENT' ? Math.max(0, rawCount) : 0;
        visit.note = newNote;

        saveState();
        closeModal();
        showToast('Rundgang-Eintrag aktualisiert.', 'success');
        renderApp();
      });
    }

    /* ==========================================================================
       7. CORE CRUD ACTIONS (WARDS & VISITS)
       ========================================================================== */
    function addVisitRecord({ wardId, date, status, consentCount, note }) {
      const normalizedCount = status === 'BROAD_CONSENT' ? Math.max(0, parseInt(consentCount, 10) || 0) : 0;
      const newVisit = {
        id: generateId('vis'),
        wardId,
        date: date || getTodayISO(),
        status,
        consentCount: normalizedCount,
        note: (note || '').trim(),
        createdAt: Date.now()
      };
      state.visits.push(newVisit);
      saveState();
      return newVisit;
    }

    function deleteVisitWithUndo(visitId) {
      const idx = state.visits.findIndex(v => v.id === visitId);
      if (idx === -1) return;
      const deletedCopy = { ...state.visits[idx] };
      const ward = state.wards.find(w => w.id === deletedCopy.wardId);

      showConfirmModal({
        title: 'RUNDGANG LÖSCHEN',
        message: `Möchten Sie den Rundgang-Eintrag vom ${formatDateDE(deletedCopy.date)} (${ward ? ward.stationNumber : 'Station'}) wirklich löschen?`,
        confirmText: 'Eintrag löschen',
        danger: true,
        onConfirm: () => {
          state.visits = state.visits.filter(v => v.id !== visitId);
          saveState();
          renderApp();
          showToast(
            `Rundgang vom ${formatDateDE(deletedCopy.date)} gelöscht.`,
            'info',
            () => {
              state.visits.push(deletedCopy);
              saveState();
              renderApp();
              showToast('Eintrag wiederhergestellt.', 'success');
            }
          );
        }
      });
    }

    function deleteWardWithConfirm(wardId) {
      const ward = state.wards.find(w => w.id === wardId);
      if (!ward) return;
      const wardVisitCount = state.visits.filter(v => v.wardId === wardId).length;

      showConfirmModal({
        title: 'STATION ENTFERNEN',
        message: `Möchten Sie "${ward.stationNumber}" inklusive ${wardVisitCount} gespeicherter Rundgänge unwiderruflich löschen?`,
        confirmText: 'Station löschen',
        danger: true,
        onConfirm: () => {
          state.wards = state.wards.filter(w => w.id !== wardId);
          state.visits = state.visits.filter(v => v.wardId !== wardId);
          saveState();
          state.ui.activeTab = 'STATIONS';
          state.ui.selectedWardId = null;
          renderApp();
          showToast(`${ward.stationNumber} wurde gelöscht.`, 'info');
        }
      });
    }

    function openWardDetail(wardId, tab = 'OVERVIEW') {
      state.ui.selectedWardId = wardId;
      state.ui.wardDetailTab = tab;
      state.ui.activeTab = 'WARD_DETAIL';
      if (tab === 'QUICK_ENTRY') {
        state.ui.qeDate = getTodayISO();
        state.ui.qeStatus = 'BROAD_CONSENT';
        state.ui.qeCount = 1;
        state.ui.qeNote = '';
      }
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function startWalkMode(specificWardId = null) {
      const sorted = getSortedWardsList();
      if (sorted.length === 0) {
        showToast('Keine Stationen vorhanden. Bitte zuerst eine Station anlegen.', 'error');
        openAddWardModal();
        return;
      }
      const today = getTodayISO();
      let targetWard = null;
      if (specificWardId) {
        targetWard = sorted.find(w => w.id === specificWardId);
      }
      if (!targetWard) {
        // Default to first ward not yet visited today, or the first ward overall
        targetWard = sorted.find(w => !state.visits.some(v => v.wardId === w.id && v.date === today)) || sorted[0];
      }
      state.ui.walkWardId = targetWard.id;
      state.ui.walkDate = today;
      state.ui.walkStatus = 'BROAD_CONSENT';
      state.ui.walkCount = 1;
      state.ui.walkNote = '';
      state.ui.activeTab = 'WALK_MODE';
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ==========================================================================
       8. REAL .XLSX EXCEL EXPORT & JSON BACKUP ENGINE (SheetJS)
       ========================================================================== */
    function exportCompleteXLSX() {
      if (typeof XLSX === 'undefined') {
        showToast('Excel-Exportbibliothek konnte nicht geladen werden.', 'error');
        return;
      }

      const sortedWards = getSortedWardsList();

      // Sheet 1: Stationsübersicht
      const wardRows = sortedWards.map(w => {
        const stats = getWardStats(w.id);
        const latestStatusLabel = stats.latestVisit
          ? (VISIT_STATUS[stats.latestVisit.status]?.label || stats.latestVisit.status)
          : 'Noch nicht besucht';
        return {
          'Stationsnummer': w.stationNumber,
          'Stationsname': w.wardName || '',
          'Adresse': w.location,
          'Ansprechpartner': w.contactName || '',
          'Ansprechpartner-Rolle': w.contactRole || '',
          'Kontaktdaten': w.contactInfo || '',
          'Postfach-Ort': w.mailboxLocation,
          'Stationsanmerkungen': w.notes || '',
          'Anzahl Rundgänge': stats.visitCount,
          'Broad Consent Gesamtzahl': stats.totalConsents,
          'Letzter Rundgang': stats.latestVisit ? formatDateDE(stats.latestVisit.date) : '—',
          'Letzter Status': latestStatusLabel
        };
      });

      // Sheet 2: Rundgänge
      const wardMap = Object.fromEntries(state.wards.map(w => [w.id, w]));
      const sortedVisits = [...state.visits].sort((a, b) => {
        if (b.date !== a.date) return b.date.localeCompare(a.date);
        return (b.createdAt || 0) - (a.createdAt || 0);
      });

      const visitRows = sortedVisits.map(v => {
        const w = wardMap[v.wardId];
        return {
          'Stationsnummer': w ? w.stationNumber : 'Unbekannt',
          'Stationsname': w ? (w.wardName || '') : '',
          'Datum': formatDateDE(v.date),
          'Status': VISIT_STATUS[v.status]?.label || v.status,
          'Anzahl Broad Consents': v.status === 'BROAD_CONSENT' ? (Number(v.consentCount) || 0) : 0,
          'Rundgangsnotiz': v.note || ''
        };
      });

      const wb = XLSX.utils.book_new();
      const wsWards = XLSX.utils.json_to_sheet(
        wardRows.length > 0 ? wardRows : [{ 'Hinweis': 'Keine Stationen vorhanden' }]
      );
      const wsVisits = XLSX.utils.json_to_sheet(
        visitRows.length > 0 ? visitRows : [{ 'Hinweis': 'Keine Rundgänge vorhanden' }]
      );

      wsWards['!cols'] = [
        { wch: 16 }, { wch: 26 }, { wch: 28 }, { wch: 22 }, { wch: 20 },
        { wch: 24 }, { wch: 32 }, { wch: 34 }, { wch: 16 }, { wch: 22 },
        { wch: 16 }, { wch: 24 }
      ];
      wsVisits['!cols'] = [
        { wch: 16 }, { wch: 26 }, { wch: 14 }, { wch: 26 }, { wch: 20 }, { wch: 42 }
      ];

      XLSX.utils.book_append_sheet(wb, wsWards, 'Stationsübersicht');
      XLSX.utils.book_append_sheet(wb, wsVisits, 'Rundgänge');

      const filename = `ZKIMED_Consent_Gesamtdaten_${getTodayISO()}.xlsx`;
      XLSX.writeFile(wb, filename);
      showToast(`Excel-Gesamtexport erstellt: ${filename}`, 'success');
    }

    function exportDayXLSX(targetDateISO) {
      if (typeof XLSX === 'undefined') {
        showToast('Excel-Exportbibliothek konnte nicht geladen werden.', 'error');
        return;
      }

      const dayVisits = state.visits
        .filter(v => v.date === targetDateISO)
        .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

      if (dayVisits.length === 0) {
        showToast(`Keine Rundgänge für den ${formatDateDE(targetDateISO)} vorhanden.`, 'error');
        return;
      }

      const wardMap = Object.fromEntries(state.wards.map(w => [w.id, w]));
      const rows = dayVisits.map(v => {
        const w = wardMap[v.wardId];
        return {
          'Stationsnummer': w ? w.stationNumber : 'Unbekannt',
          'Stationsname': w ? (w.wardName || '') : '',
          'Standort': w ? w.location : '',
          'Datum': formatDateDE(v.date),
          'Status': VISIT_STATUS[v.status]?.label || v.status,
          'Anzahl Broad Consents': v.status === 'BROAD_CONSENT' ? (Number(v.consentCount) || 0) : 0,
          'Rundgangsnotiz': v.note || '',
          'Ansprechpartner': w ? (w.contactName || '') : ''
        };
      });

      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(rows);
      ws['!cols'] = [
        { wch: 16 }, { wch: 26 }, { wch: 28 }, { wch: 14 },
        { wch: 26 }, { wch: 20 }, { wch: 40 }, { wch: 22 }
      ];
      XLSX.utils.book_append_sheet(wb, ws, 'Tagesrundgang');

      const filename = `ZKIMED_Tagesrundgang_${targetDateISO}.xlsx`;
      XLSX.writeFile(wb, filename);
      showToast(`Tagesrundgang exportiert: ${filename}`, 'success');
    }

    function exportJSONBackup() {
      const payload = {
        system: 'ZKIMED | CONSENT OPERATIONS',
        exportedAt: new Date().toISOString(),
        wards: state.wards,
        visits: state.visits,
        settings: state.settings
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ZKIMED_Backup_${getTodayISO()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('JSON-Sicherung heruntergeladen.', 'success');
    }

              <button type="button" id="mc-open-stations" class="touch-btn min-h-[56px] px-4 py-3 bg-white hover:bg-space-panel text-space-graphite border border-space-border font-display font-bold uppercase tracking-wider text-sm flex items-center justify-center gap-2.5">
                ${ICONS.wards}
                <span>Übersicht öffnen</span>
              </button>

              <button type="button" id="mc-open-export" class="touch-btn min-h-[56px] px-4 py-3 bg-white hover:bg-space-panel text-space-graphite border border-space-border font-display font-bold uppercase tracking-wider text-sm flex items-center justify-center gap-2.5">
                ${ICONS.export}
                <span>Daten exportieren</span>
              </button>
            </div>
          </section>

          <!-- PROGRESS TELEMETRY & RECENT ACTIVITY -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <!-- Left: Mission Progress Visualization -->
            <section class="sf-module lg:col-span-5 flex flex-col">
              <div class="sf-module-header">
                <span class="sf-label">MISSIONSFORTSCHRITT · TELEMETRY</span>
              </div>
              <div class="p-4 sm:p-5 space-y-5 flex-1 flex flex-col justify-between">
                <!-- Bar 1: Ever visited wards -->
                <div>
                  <div class="flex justify-between items-baseline mb-1.5">
                    <span class="text-sm font-semibold text-space-graphite">Abgedeckte Stationen gesamt</span>
                    <span class="font-mono text-sm font-bold text-space-graphite">${stats.everVisitedCount} / ${totalWards} (${everPct}%)</span>
                  </div>
                  <div class="w-full h-4 bg-space-metal border border-space-border p-0.5">
                    <div class="h-full bg-space-graphite transition-all duration-300" style="width: ${everPct}%"></div>
                  </div>
                </div>

                <!-- Bar 2: Visited today -->
                <div>
                  <div class="flex justify-between items-baseline mb-1.5">
                    <span class="text-sm font-semibold text-space-graphite">Heutige Stationsabdeckung</span>
                    <span class="font-mono text-sm font-bold text-zkimed-red">${stats.visitedTodayCount} / ${totalWards} (${todayPct}%)</span>
                  </div>
                  <div class="w-full h-4 bg-space-metal border border-space-border p-0.5">
                    <div class="h-full bg-zkimed-red transition-all duration-300" style="width: ${todayPct}%"></div>
                  </div>
                </div>

                <!-- Bar 3: Status distribution across all visits -->
                <div class="pt-3 border-t border-space-borderLight">
                  <div class="flex justify-between items-baseline mb-2">
                    <span class="font-display text-xs font-bold uppercase tracking-wider text-space-teal">Rundgang-Statusverteilung</span>
                    <span class="font-mono text-xs text-space-slate">${totalVisits} Rundgänge</span>
                  </div>

                  ${totalVisits === 0 ? `
                    <div class="sf-stripes p-4 text-center font-mono text-xs uppercase tracking-wider text-space-slate">
                      NO SURVEY LOGS RECORDED
                    </div>
                  ` : `
                    <div class="w-full h-5 bg-space-metal border border-space-border flex overflow-hidden">
                      <div class="h-full bg-zkimed-green" style="width: ${greenPct}%" title="Broad Consent eingesammelt"></div>
                      <div class="h-full bg-zkimed-bluegrey" style="width: ${leerPct}%" title="Leer"></div>
                      <div class="h-full bg-zkimed-amber" style="width: ${uninfPct}%" title="Uninformiert"></div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mt-3 text-xs">
                      <div class="p-2 bg-zkimed-greenLight border border-zkimed-green/40 flex items-center justify-between">
                        <span class="font-medium text-zkimed-green">Broad Consent</span>
                        <span class="font-mono font-bold text-zkimed-green">${stats.statusBreakdown.BROAD_CONSENT}</span>
                      </div>
                      <div class="p-2 bg-zkimed-bluegreyLight border border-zkimed-bluegrey/40 flex items-center justify-between">
                        <span class="font-medium text-zkimed-bluegrey">Leer</span>
                        <span class="font-mono font-bold text-zkimed-bluegrey">${stats.statusBreakdown.LEER}</span>
                      </div>
                      <div class="p-2 bg-zkimed-amberLight border border-zkimed-amber/40 flex items-center justify-between">
                        <span class="font-medium text-zkimed-amber">Uninformiert</span>
                        <span class="font-mono font-bold text-zkimed-amber">${stats.statusBreakdown.UNINFORMIERT}</span>
                      </div>
                    </div>
                  `}
                </div>
              </div>
            </section>

            <!-- Right: Latest Visit Activity -->
            <section class="sf-module lg:col-span-7 flex flex-col">
              <div class="sf-module-header justify-between">
                <span class="sf-label">LETZTE RUNDGANG-AKTIVITÄTEN · SURVEY LOG</span>
                <button type="button" id="mc-view-all-logs" class="text-xs font-display font-bold uppercase tracking-wider text-zkimed-red hover:underline">
                  Alle anzeigen →
                </button>
              </div>
              <div class="divide-y divide-space-borderLight flex-1">
                ${recentVisits.length === 0 ? `
                  <div class="p-8">
                    <div class="sf-stripes p-6 text-center">
                      <div class="font-mono text-sm font-bold text-space-slate uppercase">NO RESEARCH LOGS IN PROGRESS</div>
                      <p class="text-sm text-space-slate mt-1">Starten Sie einen Rundgang, um den ersten Eintrag zu erfassen.</p>
                    </div>
                  </div>
                ` : recentVisits.map(v => {
                  const w = wardMap[v.wardId];
                  return `
                    <div data-open-ward="${v.wardId}" class="mc-activity-row p-3.5 sm:px-4 hover:bg-space-panel cursor-pointer transition-colors flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                      <div class="min-w-0 flex-1">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="font-mono text-xs font-bold px-2 py-0.5 bg-space-metal border border-space-borderLight text-space-graphite">
                            ${formatDateDE(v.date)}
                          </span>
                          <span class="font-display font-bold text-base text-space-graphite">
                            ${escapeHTML(w ? w.stationNumber : 'Unbekannte Station')}
                          </span>
                          ${w && w.wardName ? `<span class="text-xs text-space-slate truncate">· ${escapeHTML(w.wardName)}</span>` : ''}
                        </div>
                        ${v.note ? `<p class="text-xs sm:text-sm text-space-slate mt-1 truncate">${escapeHTML(v.note)}</p>` : ''}
                      </div>
                      <div class="flex items-center gap-2.5 shrink-0">
                        ${renderStatusBadge(v.status, true)}
                        ${v.status === 'BROAD_CONSENT' ? `
                          <span class="font-mono text-sm font-bold px-2.5 py-1 bg-zkimed-green text-white rounded-[2px]">
                            +${v.consentCount}
                          </span>

                }).join('')}
              </div>
            </section>
          </div>
        </div>
      `;
    }

    /* --------------------------------------------------------------------------
       VIEW 2: WARD OVERVIEW (STATIONS DIRECTORY)
       -------------------------------------------------------------------------- */
    function renderStationsView() {
      const q = state.ui.stationSearch.trim().toLowerCase();
      const filter = state.ui.stationFilter;
      const sortBy = state.ui.stationSortBy;
      const sortDir = state.ui.stationSortDir;

      // Enrich wards with stats
      let list = state.wards.map(w => ({
        ...w,
        stats: getWardStats(w.id)
      }));

      // Search filter
      if (q) {
        list = list.filter(w =>
          w.stationNumber.toLowerCase().includes(q) ||
          (w.wardName && w.wardName.toLowerCase().includes(q)) ||
          w.location.toLowerCase().includes(q) ||
          w.mailboxLocation.toLowerCase().includes(q) ||
          (w.contactName && w.contactName.toLowerCase().includes(q))
        );
      }

      // Status filter
      if (filter === 'UNVISITED') {
        list = list.filter(w => w.stats.visitCount === 0);
      } else if (filter === 'VISITED_TODAY') {
        list = list.filter(w => w.stats.visitedToday);
      }

      // Sorting
      list.sort((a, b) => {
        let cmp = 0;
        if (sortBy === 'LAST_VISIT') {
          const da = a.stats.latestVisit ? a.stats.latestVisit.date : '0000-00-00';
          const db = b.stats.latestVisit ? b.stats.latestVisit.date : '0000-00-00';
          cmp = da.localeCompare(db);
        } else {
          cmp = a.stationNumber.localeCompare(b.stationNumber, 'de', { numeric: true, sensitivity: 'base' });
        }
        return sortDir === 'ASC' ? cmp : -cmp;
      });

      return `
        <div class="space-y-4">
          <!-- Controls & Filter Module -->
          <section class="sf-module">
            <div class="sf-module-header justify-between">
              <span class="sf-label">STATIONSVERZEICHNIS · WARD DIRECTORY (${list.length} / ${state.wards.length})</span>
              <button type="button" id="st-add-ward-btn" class="touch-btn px-4 py-2 bg-zkimed-red hover:bg-zkimed-redDark text-white font-display text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                ${ICONS.plus}
                <span>Station hinzufügen</span>
              </button>
            </div>

            <div class="p-3.5 sm:p-4 space-y-3">
              <!-- Search & Sort Row -->
              <div class="flex flex-col md:flex-row gap-3">
                <div class="relative flex-1">
                  <span class="absolute left-3 top-1/2 -translate-y-1/2 text-space-slate pointer-events-none">
                    ${ICONS.search}
                  </span>
                  <input
                    type="search"
                    id="st-search-input"
                    value="${escapeHTML(state.ui.stationSearch)}"
                    placeholder="Station, Fachbereich, Standort, Postfach oder Kontakt suchen..."
                    class="touch-input w-full pl-10 pr-4"
                  />
                </div>

                <div class="flex flex-wrap sm:flex-nowrap gap-2">
                  <select id="st-sort-select" aria-label="Sortieren nach" class="touch-input font-semibold text-sm bg-white min-w-[190px]">
                    <option value="NUMBER_ASC" ${sortBy === 'NUMBER' && sortDir === 'ASC' ? 'selected' : ''}>Stationsnummer (A → Z)</option>
                    <option value="NUMBER_DESC" ${sortBy === 'NUMBER' && sortDir === 'DESC' ? 'selected' : ''}>Stationsnummer (Z → A)</option>
                    <option value="LAST_VISIT_DESC" ${sortBy === 'LAST_VISIT' && sortDir === 'DESC' ? 'selected' : ''}>Letzter Rundgang (Neueste)</option>
                    <option value="LAST_VISIT_ASC" ${sortBy === 'LAST_VISIT' && sortDir === 'ASC' ? 'selected' : ''}>Letzter Rundgang (Älteste)</option>
                  </select>
                </div>
              </div>

              <!-- Filter Pills -->
              <div class="flex flex-wrap gap-2">
                <button type="button" data-st-filter="ALL" class="st-filter-btn touch-btn px-4 py-2 border text-xs sm:text-sm font-semibold ${filter === 'ALL' ? 'bg-space-graphite text-white border-space-graphite' : 'bg-white text-space-graphite border-space-border hover:bg-space-panel'}">
                  Alle Stationen (${state.wards.length})
                </button>
                <button type="button" data-st-filter="UNVISITED" class="st-filter-btn touch-btn px-4 py-2 border text-xs sm:text-sm font-semibold ${filter === 'UNVISITED' ? 'bg-zkimed-amber text-white border-zkimed-amber' : 'bg-white text-space-graphite border-space-border hover:bg-space-panel'}">
                  Noch nicht besucht (${state.wards.filter(w => getWardStats(w.id).visitCount === 0).length})
                </button>
                <button type="button" data-st-filter="VISITED_TODAY" class="st-filter-btn touch-btn px-4 py-2 border text-xs sm:text-sm font-semibold ${filter === 'VISITED_TODAY' ? 'bg-zkimed-green text-white border-zkimed-green' : 'bg-white text-space-graphite border-space-border hover:bg-space-panel'}">
                  Heute besucht (${state.wards.filter(w => getWardStats(w.id).visitedToday).length})
                </button>
              </div>
            </div>
          </section>

          <!-- Ward Cards List -->
          ${list.length === 0 ? `
            <div class="sf-module p-6">
              <div class="sf-stripes p-8 text-center">
                <div class="font-mono text-sm font-bold uppercase text-space-slate">KEINE PASSENDEN STATIONEN GEFUNDEN</div>
                <p class="text-sm text-space-slate mt-1">Passen Sie Suchbegriff oder Filter an oder legen Sie eine neue Station an.</p>
              </div>
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
              ${list.map(w => {
                const st = w.stats;
                return `
                  <article data-ward-card="${w.id}" class="ward-card sf-module hover:border-space-graphite cursor-pointer transition-colors flex flex-col justify-between ${st.visitedToday ? 'border-l-4 border-l-zkimed-green' : st.visitCount === 0 ? 'border-l-4 border-l-zkimed-amber' : ''}">
                    <div class="p-4 space-y-3">
                      <!-- Card Header -->
                      <div class="flex items-start justify-between gap-2">
                        <div>
                          <div class="flex flex-wrap items-center gap-2">
                            <h2 class="font-display text-xl font-bold text-space-graphite">${escapeHTML(w.stationNumber)}</h2>
                            ${st.visitedToday ? `
                              <span class="inline-flex items-center gap-1 px-2 py-0.5 bg-zkimed-green text-white font-mono text-[11px] font-bold uppercase">
                                ${ICONS.check} HEUTE
                              </span>
                            ` : st.visitCount === 0 ? `
                              <span class="inline-flex items-center px-2 py-0.5 bg-zkimed-amberLight border border-zkimed-amber text-zkimed-amber font-mono text-[11px] font-bold uppercase">
                                NEU / UNBESUCHT
                              </span>
                            ` : ''}
                          </div>
                          ${w.wardName ? `<div class="text-sm font-semibold text-space-slate mt-0.5">${escapeHTML(w.wardName)}</div>` : ''}
                        </div>

                        <div class="text-right shrink-0 bg-space-panel border border-space-borderLight px-3 py-1.5">
                          <div class="font-display text-[10px] font-bold uppercase tracking-wider text-space-teal">Consents</div>
                          <div class="font-mono text-xl font-bold text-zkimed-green">${st.totalConsents}</div>
                        </div>
                      </div>

                      <!-- Location & Contact -->
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs sm:text-sm text-space-slate">
                        <div class="flex items-center gap-1.5 truncate">
                          <span class="text-space-teal shrink-0">${ICONS.pin}</span>
                          <span class="truncate">${escapeHTML(w.location)}</span>
                        </div>
                        <div class="flex items-center gap-1.5 truncate">
                          <span class="text-space-teal shrink-0">${ICONS.user}</span>
                          <span class="truncate">${escapeHTML(w.contactName || 'Kein Kontakt hinterlegt')}</span>
                        </div>
                      </div>

                      <!-- Prominent Mailbox Callout -->
                      <div class="p-2.5 bg-space-panel border border-space-borderLight flex items-start gap-2">
                        <span class="text-zkimed-red mt-0.5 shrink-0">${ICONS.mailbox}</span>
                        <div class="text-xs sm:text-sm">
                          <span class="font-display font-bold uppercase text-[11px] tracking-wider text-space-teal mr-1.5">Postfach:</span>
                          <span class="font-medium text-space-graphite">${escapeHTML(w.mailboxLocation)}</span>
                        </div>
                      </div>
                    </div>

                    <!-- Card Footer: Last Visit + Direct Quick-Add Visit Button -->
                    <div class="px-4 py-3 bg-space-panel border-t border-space-borderLight flex flex-wrap items-center justify-between gap-2">
                      <div class="text-xs">
                        ${st.latestVisit ? `
                          <div class="flex flex-wrap items-center gap-2">
                            <span class="font-mono font-semibold text-space-graphite">${formatDateDE(st.latestVisit.date)}</span>
                            ${renderStatusBadge(st.latestVisit.status, true)}
                          </div>
                        ` : `
                          <span class="font-mono text-space-slate uppercase">Noch kein Rundgang</span>
                        `}
                      </div>

                      <button type="button" data-quick-visit="${w.id}" class="quick-visit-btn touch-btn px-3.5 py-2 bg-zkimed-red hover:bg-zkimed-redDark text-white font-display text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 shrink-0">
                        ${ICONS.plus}
                        <span>Neuer Rundgang</span>
                      </button>
                    </div>
                  </article>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    /* --------------------------------------------------------------------------
       VIEW 3: WARD DETAIL PAGE (3 TABS + PREV/NEXT NAVIGATION)
       -------------------------------------------------------------------------- */
    function renderWardDetailView() {
      const sorted = getSortedWardsList();
      const idx = sorted.findIndex(w => w.id === state.ui.selectedWardId);
      const ward = idx >= 0 ? sorted[idx] : sorted[0];

      if (!ward) {
        state.ui.activeTab = 'STATIONS';
        return renderStationsView();
      }
      state.ui.selectedWardId = ward.id;

      const prevWard = idx > 0 ? sorted[idx - 1] : null;
      const nextWard = idx < sorted.length - 1 ? sorted[idx + 1] : null;
      const stats = getWardStats(ward.id);
      const visits = getWardVisits(ward.id);
      const activeSubTab = state.ui.wardDetailTab;

      return `
        <div class="space-y-4">
          <!-- Top Breadcrumb & Prev/Next Ward Bar -->
          <div class="flex flex-wrap items-center justify-between gap-2">
            <button type="button" id="wd-back-btn" class="touch-btn px-4 py-2.5 bg-white hover:bg-space-panel border border-space-border font-display text-xs sm:text-sm font-bold uppercase tracking-wider text-space-graphite">
              ← Zurück zur Übersicht
            </button>

            <div class="flex items-center gap-2">
              <button type="button" id="wd-prev-btn" ${!prevWard ? 'disabled' : ''} class="touch-btn px-3.5 py-2.5 border border-space-border bg-white font-display text-xs font-bold uppercase tracking-wider ${prevWard ? 'hover:bg-space-panel text-space-graphite' : 'opacity-40 cursor-not-allowed'}">
                ‹ Vorherige
              </button>
              <span class="font-mono text-xs font-semibold px-2.5 py-1 bg-space-metal border border-space-borderLight">
                ${idx + 1} / ${sorted.length}
              </span>
              <button type="button" id="wd-next-btn" ${!nextWard ? 'disabled' : ''} class="touch-btn px-3.5 py-2.5 border border-space-border bg-white font-display text-xs font-bold uppercase tracking-wider ${nextWard ? 'hover:bg-space-panel text-space-graphite' : 'opacity-40 cursor-not-allowed'}">
                Nächste ›
              </button>
            </div>
          </div>

          <!-- Ward Identity Header & Mailbox Highlight -->
          <section class="sf-module">
            <div class="sf-module-header accent-red justify-between">
              <span class="sf-label">STATIONSPROFIL · WARD TELEMETRY</span>
              <button type="button" id="wd-delete-ward-btn" class="px-3 py-1 border border-zkimed-red/40 bg-zkimed-redLight text-zkimed-red hover:bg-zkimed-red hover:text-white font-display text-xs font-bold uppercase tracking-wider flex items-center gap-1">
                ${ICONS.trash}
                <span>Station löschen</span>
              </button>
            </div>

            <div class="p-4 sm:p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
              <div>
                <div class="flex flex-wrap items-center gap-2.5">
                  <h2 class="font-display text-2xl sm:text-3xl font-bold text-space-graphite">${escapeHTML(ward.stationNumber)}</h2>
                  ${stats.visitedToday ? `
                    <span class="inline-flex items-center gap-1 px-2.5 py-1 bg-zkimed-green text-white font-mono text-xs font-bold uppercase">
                      ${ICONS.check} HEUTE BESUCHT
                    </span>
                  ` : ''}
                </div>
                <p class="text-sm sm:text-base text-space-slate mt-1">
                  ${ward.wardName ? `<strong class="text-space-graphite">${escapeHTML(ward.wardName)}</strong> · ` : ''}${escapeHTML(ward.location)}
                </p>

                <!-- Fast-access Mailbox Banner -->
                <div class="mt-3 inline-flex items-center gap-2.5 px-3.5 py-2 bg-space-panel border border-space-border">
                  <span class="text-zkimed-red">${ICONS.mailbox}</span>
                  <span class="font-display text-xs font-bold uppercase tracking-wider text-space-teal">Postfach:</span>
                  <span class="text-sm font-semibold text-space-graphite">${escapeHTML(ward.mailboxLocation)}</span>
                </div>
              </div>

              <!-- Ward Key Counters -->
              <div class="grid grid-cols-3 gap-2.5 shrink-0">
                <div class="p-3 bg-zkimed-greenLight border border-zkimed-green/40 text-center min-w-[95px]">
                  <div class="font-display text-[10px] font-bold uppercase tracking-wider text-zkimed-green">Consents</div>
                  <div class="font-mono text-2xl font-bold text-zkimed-green mt-0.5">${stats.totalConsents}</div>
                </div>
                <div class="p-3 bg-space-panel border border-space-borderLight text-center min-w-[95px]">
                  <div class="font-display text-[10px] font-bold uppercase tracking-wider text-space-teal">Rundgänge</div>
                  <div class="font-mono text-2xl font-bold text-space-graphite mt-0.5">${stats.visitCount}</div>
                </div>
                <div class="p-3 bg-space-panel border border-space-borderLight text-center min-w-[105px]">
                  <div class="font-display text-[10px] font-bold uppercase tracking-wider text-space-teal">Letzter Besuch</div>
                  <div class="font-mono text-sm sm:text-base font-bold text-space-graphite mt-1.5">
                    ${stats.latestVisit ? formatDateDE(stats.latestVisit.date) : '—'}
                  </div>
                </div>
              </div>
            </div>

            <!-- 3 SUB-TABS -->
            <div class="grid grid-cols-3 border-t border-space-border bg-space-metal">
              <button type="button" data-wd-tab="OVERVIEW" class="wd-tab-btn touch-btn py-3.5 px-2 sm:px-4 font-display text-xs sm:text-sm font-bold uppercase tracking-wider border-r border-space-border ${activeSubTab === 'OVERVIEW' ? 'bg-space-surface text-zkimed-red border-b-2 border-b-zkimed-red' : 'text-space-slate hover:bg-space-panel'}">
                1. Übersicht
              </button>
              <button type="button" data-wd-tab="HISTORY" class="wd-tab-btn touch-btn py-3.5 px-2 sm:px-4 font-display text-xs sm:text-sm font-bold uppercase tracking-wider border-r border-space-border ${activeSubTab === 'HISTORY' ? 'bg-space-surface text-zkimed-red border-b-2 border-b-zkimed-red' : 'text-space-slate hover:bg-space-panel'}">
                2. Historie (${visits.length})
              </button>
              <button type="button" data-wd-tab="QUICK_ENTRY" class="wd-tab-btn touch-btn py-3.5 px-2 sm:px-4 font-display text-xs sm:text-sm font-bold uppercase tracking-wider ${activeSubTab === 'QUICK_ENTRY' ? 'bg-zkimed-red text-white' : 'text-zkimed-red bg-zkimed-redLight hover:bg-zkimed-red hover:text-white'}">
                3. Schnellerfassung
              </button>
            </div>
          </section>

          <!-- SUB-TAB CONTENT -->
          ${activeSubTab === 'OVERVIEW' ? renderWardOverviewTab(ward) : ''}
          ${activeSubTab === 'HISTORY' ? renderWardHistoryTab(ward, visits) : ''}
          ${activeSubTab === 'QUICK_ENTRY' ? renderWardQuickEntryTab(ward, nextWard) : ''}
        </div>
      `;
    }

    function renderWardOverviewTab(ward) {
      return `
        <section class="sf-module">
          <div class="sf-module-header">
            <span class="sf-label">STAMMDATEN &amp; POSTFACH-KONFIGURATION · EDITIERBAR</span>
          </div>
          <form id="wd-edit-form" class="p-4 sm:p-6 space-y-5">
            <div id="wd-edit-error" class="hidden p-3 bg-zkimed-redLight border border-zkimed-red text-zkimed-red text-sm font-medium"></div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>

    function renderWardHistoryTab(ward, visits) {
      return `
        <section class="sf-module">
          <div class="sf-module-header justify-between">
            <span class="sf-label">RUNDGANG-HISTORIE · CHRONOLOGICAL SURVEY LOG</span>
            <button type="button" id="wd-hist-add-btn" class="touch-btn px-4 py-2 bg-zkimed-red hover:bg-zkimed-redDark text-white font-display text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
              ${ICONS.plus}
              <span>Neuer Rundgang</span>
            </button>
          </div>

          ${visits.length === 0 ? `
            <div class="p-6">
              <div class="sf-stripes p-8 text-center">
                <div class="font-mono text-sm font-bold uppercase text-space-slate">NO VISITS RECORDED FOR ${escapeHTML(ward.stationNumber)}</div>

                return `
                  <div class="p-4 sm:p-5 ${isLatest ? 'bg-space-panel/70 border-l-4 border-l-zkimed-red' : 'bg-white'} flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="space-y-1.5 flex-1">
                      <div class="flex flex-wrap items-center gap-2.5">
                        <span class="font-mono text-base font-bold text-space-graphite">${formatDateDE(v.date)}</span>
                        ${isLatest ? `
                          <span class="px-2 py-0.5 bg-space-graphite text-white font-mono text-[10px] font-bold uppercase tracking-wider">
                            AKTUELLSTER EINTRAG
                          </span>

                        ${renderStatusBadge(v.status)}

                          <span class="font-mono text-sm font-bold px-2.5 py-0.5 bg-zkimed-green text-white rounded-[2px]">

                      </div>
                      <p class="text-sm text-space-slate">

                    <div class="flex items-center gap-2 shrink-0">
                      <button type="button" data-edit-visit="${v.id}" class="edit-visit-btn touch-btn px-3.5 py-2 border border-space-border bg-white hover:bg-space-panel text-space-graphite text-xs font-semibold flex items-center gap-1.5">

                      </button>

              }).join('')}

          `}

    function renderWardQuickEntryTab(ward, nextWard) {
      const { qeDate, qeStatus, qeCount, qeNote } = state.ui;

      return `
        <section class="sf-module">
          <div class="sf-module-header accent-red justify-between">
            <span class="sf-label">SCHNELLERFASSUNG · FIELD CONSENT ENTRY</span>
            <span class="font-mono text-xs text-space-slate">${escapeHTML(ward.stationNumber)}</span>
          </div>

          <div class="p-4 sm:p-6 space-y-6">
            <!-- 1. DATE -->
            <div>
              <label class="block font-display text-xs font-bold uppercase tracking-wider text-space-teal mb-2">
                1. Datum des Rundgangs
              </label>
              <div class="flex flex-wrap items-center gap-2.5">
                <input type="date" id="qe-date-input" value="${escapeHTML(qeDate)}" class="touch-input font-mono text-base font-semibold min-w-[190px]" />
                <button type="button" id="qe-date-today" class="touch-btn px-4 py-2.5 border border-space-border bg-white hover:bg-space-panel text-xs font-display font-bold uppercase tracking-wider">
                  Heute (${formatDateDE(getTodayISO())})
                </button>
                <button type="button" id="qe-date-yesterday" class="touch-btn px-4 py-2.5 border border-space-border bg-white hover:bg-space-panel text-xs font-display font-bold uppercase tracking-wider">
                  Gestern
                </button>
              </div>
            </div>

            <!-- 2. CONSENT STATUS -->
            <div>
              <label class="block font-display text-xs font-bold uppercase tracking-wider text-space-teal mb-2">
                2. Consent-Status auswählen
              </label>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                ${Object.values(VISIT_STATUS).map(st => {
                  const active = qeStatus === st.key;
                  let activeStyle = 'border-space-border bg-white text-space-graphite hover:bg-space-panel';
                  if (active) {
                    if (st.key === 'BROAD_CONSENT') activeStyle = 'border-zkimed-green bg-zkimed-green text-white shadow-sm';
                    else if (st.key === 'UNINFORMIERT') activeStyle = 'border-zkimed-amber bg-zkimed-amber text-white shadow-sm';
                    else activeStyle = 'border-zkimed-bluegrey bg-zkimed-bluegrey text-white shadow-sm';
                  }
                  return `
                    <button type="button" data-qe-status="${st.key}" class="qe-status-btn touch-btn min-h-[60px] px-4 py-3 border-2 text-left flex items-center justify-between ${activeStyle}">
                      <span class="font-bold text-base">${escapeHTML(st.label)}</span>
                      <span class="font-mono text-xs opacity-80">${st.code}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- 3. DYNAMIC QUANTITY INPUT (Broad Consent eingesammelt) -->
            ${qeStatus === 'BROAD_CONSENT' ? `
              <div class="p-4 sm:p-5 bg-zkimed-greenLight border-2 border-zkimed-green">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                  <label class="font-display text-xs sm:text-sm font-bold uppercase tracking-wider text-zkimed-green">
                    3. Anzahl eingesammelter Broad Consents
                  </label>
                  <div class="flex gap-1.5">
                    <button type="button" data-qe-add="1" class="qe-quick-add touch-btn px-3 py-1.5 bg-white border border-zkimed-green text-zkimed-green font-mono text-xs font-bold">+1</button>
                    <button type="button" data-qe-add="2" class="qe-quick-add touch-btn px-3 py-1.5 bg-white border border-zkimed-green text-zkimed-green font-mono text-xs font-bold">+2</button>
                    <button type="button" data-qe-add="5" class="qe-quick-add touch-btn px-3 py-1.5 bg-white border border-zkimed-green text-zkimed-green font-mono text-xs font-bold">+5</button>
                  </div>
                </div>
                <div class="flex items-center gap-3 max-w-md">
                  <button type="button" id="qe-dec-btn" class="touch-btn w-16 h-16 bg-white border-2 border-zkimed-green text-zkimed-green font-mono text-3xl font-bold flex items-center justify-center hover:bg-zkimed-green hover:text-white">

                  <input type="number" id="qe-count-input" min="0" inputmode="numeric" value="${qeCount}" class="touch-input flex-1 h-16 text-center font-mono text-3xl font-bold border-2 border-zkimed-green" />
                  <button type="button" id="qe-inc-btn" class="touch-btn w-16 h-16 bg-zkimed-green text-white font-mono text-3xl font-bold flex items-center justify-center hover:opacity-90">
                    +
                  </button>
                </div>
              </div>
            ` : ''}

            <!-- 4. VISIT NOTES + QUICK CHIPS -->
            <div>
              <label class="block font-display text-xs font-bold uppercase tracking-wider text-space-teal mb-2">
                ${qeStatus === 'BROAD_CONSENT' ? '4.' : '3.'} Rundgangsnotiz (Optional)

              <input type="text" id="qe-note-input" value="${escapeHTML(qeNote)}" placeholder="Kurze Beobachtung oder Hinweis eingeben..." class="touch-input w-full mb-2.5" />
              <div class="flex flex-wrap gap-2">
                ${state.settings.quickNotes.map(tpl => `
                  <button type="button" data-qe-chip="${escapeHTML(tpl)}" class="qe-note-chip touch-btn min-h-[40px] px-3 py-1.5 bg-space-panel hover:bg-space-metal border border-space-borderLight text-xs text-space-graphite text-left">

            <!-- STICKY / PROMINENT SAVE ACTIONS -->
            <div class="sticky bottom-2 z-20 p-3 bg-space-surface border border-space-border shadow-md flex flex-col sm:flex-row gap-3">
              <button type="button" id="qe-save-btn" class="touch-btn min-h-[56px] flex-1 px-5 py-3 bg-space-graphite hover:bg-space-teal text-white font-display font-bold uppercase tracking-wider text-sm flex items-center justify-center gap-2">
                ${ICONS.check}
                <span>Rundgang speichern</span>
              </button>

              ${nextWard ? `
                <button type="button" id="qe-save-next-btn" class="touch-btn min-h-[56px] flex-1 px-5 py-3 bg-zkimed-red hover:bg-zkimed-redDark text-white font-display font-bold uppercase tracking-wider text-sm flex items-center justify-center gap-2">
                  <span>Speichern &amp; Nächste (${escapeHTML(nextWard.stationNumber)}) →</span>
                </button>

          </div>
        </section>
